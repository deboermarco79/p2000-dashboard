<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persalarm</title>
    <style>
        :root {
            --bg: #0a0d12;
            --panel: #121720;
            --panel-2: #181e29;
            --line: #232a36;
            --text: #eef1f6;
            --muted: #9ba6b8;
            --dim: #5d6778;
            --prio1: #e5484d;
            --prio2: #f5a524;
            --prio3: #30a46c;
            --politie: #3e8ff0;
            --brandweer: #e5484d;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            /* Subtiele diepte i.p.v. een vlak zwart vlak, blijft donker genoeg voor een donkere kamer */
            background: radial-gradient(ellipse 90% 60% at 50% -10%, #141b26 0%, var(--bg) 55%);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Alles schaalt mee met de schermbreedte: werkt op 720p, 1080p en 4K */
            font-size: 1.15vw;                      /* terugval voor oudere tv-browsers */
            font-size: clamp(14px, 1.15vw, 48px);
            overflow: hidden;
            cursor: none;
            display: flex; flex-direction: column;
        }

        /* ---------- Header ---------- */
        header {
            flex: none;
            display: flex; align-items: center; justify-content: space-between; gap: 2em;
            padding: 1.1em 2.2vw;
            border-bottom: 1px solid var(--line);
            box-shadow: 0 0.6em 1.2em -0.6em rgba(0, 0, 0, 0.6);
        }
        .status { display: flex; align-items: center; gap: 0.7em; color: var(--muted); min-width: 0; max-width: 62vw; }
        .status-tekst { display: block; min-width: 0; }
        #statusTekst { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #statusDetail {
            display: -webkit-box; font-size: 0.7em; margin-top: 0.2em; color: var(--dim);
            white-space: normal; max-width: 100%;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .dot { flex: none; width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--muted); }
        .dot.ok { background: var(--prio3); box-shadow: 0 0 0.6em var(--prio3); animation: ademen 2.4s ease-in-out infinite; }
        .dot.warn { background: var(--prio2); }
        .dot.err { background: var(--prio1); }
        @keyframes ademen { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
        .clock { display: flex; align-items: baseline; gap: 1em; white-space: nowrap; }
        .clock .time { font-size: 2.3em; font-weight: 800; font-variant-numeric: tabular-nums; }
        .clock .date { color: var(--muted); font-size: 1.1em; }

        /* ---------- Layout ---------- */
        main {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column; gap: 1.8em;
            padding: 1.6em 2.2vw 1.4em;
        }
        .kop {
            display: flex; align-items: center; gap: 0.6em;
            color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.14em;
            font-size: 0.85em; font-weight: 600;
            margin: 0 0 0.8em;
        }
        .kop::before { content: ''; width: 0.3em; height: 0.3em; border-radius: 50%; background: var(--dim); }

        /* ---------- Laatste melding ---------- */
        .hero {
            display: grid;
            grid-template-columns: 10em minmax(0, 1fr);
            gap: 0 2.2em;
            align-items: center;
            background: linear-gradient(160deg, var(--panel-2), var(--panel));
            border-left: 0.45em solid var(--cap, var(--politie));
            border-radius: 0.7em;
            padding: 1.5em 2em;
            box-shadow: 0 1em 2.2em -1em rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.045);
        }
        /* Nieuwe melding: een knipperend blauw/rood zwaailicht, zoals een politie-/hulpdienstvoertuig —
         * dat trekt de aandacht veel directer dan een gewone kleurpuls, ook vanaf de bank. */
        .hero.fresh {
            animation: zwaailicht 1.4s steps(1, end) infinite;
        }
        @keyframes zwaailicht {
            0%, 49% { box-shadow: 0 0 2.6em 0.25em rgba(62, 143, 240, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.045); border-left-color: #3e8ff0; }
            50%, 100% { box-shadow: 0 0 2.6em 0.25em rgba(229, 72, 77, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.045); border-left-color: #e5484d; }
        }
        .hero .when { font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); padding-right: 1.6em; }
        .hero .when .t { font-size: 3.4em; font-weight: 800; line-height: 1; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }
        .hero .when .ago { color: var(--text); font-size: 1.15em; font-weight: 600; margin-top: 0.5em; }
        .hero .when .dag { color: var(--muted); font-size: 1em; font-weight: 600; margin-top: 0.15em; }
        .hero .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em 0.7em; margin-bottom: 0.6em; }
        .hero .msg {
            font-size: 2.3em; font-weight: 800; line-height: 1.25;
            overflow-wrap: anywhere; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* ---------- Labels ---------- */
        .badge {
            display: inline-flex; align-items: center;
            padding: 0.25em 0.65em; border-radius: 0.35em;
            font-weight: 700; font-size: 0.95em; letter-spacing: 0.03em;
            background: var(--panel-2); color: var(--text); white-space: nowrap;
        }
        .hero .badge { font-size: 1.1em; }
        .badge.nieuw {
            background: #fff; color: #000;
            animation: zwaailicht-badge 1.4s steps(1, end) infinite;
        }
        @keyframes zwaailicht-badge {
            0%, 49% { box-shadow: 0 0 1em 0.2em rgba(62, 143, 240, 0.8); }
            50%, 100% { box-shadow: 0 0 1em 0.2em rgba(229, 72, 77, 0.8); }
        }
        .cap {
            display: inline-flex; align-items: center; gap: 0.45em;
            color: var(--cap); font-weight: 700; white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        .hero .cap { font-size: 1.2em; }
        /* Officieel logo per dienst in een eigen rond "muntje": een vaste, gelijke vorm voor
         * elke dienst (ongeacht de eigen beeldverhouding van het logo) zodat politie en
         * brandweer altijd exact even groot en op dezelfde plek staan, met genoeg contrast
         * tegen de achtergrond om ook van een afstand (tv) meteen op te vallen. */
        .cap .icoon-rond {
            display: inline-flex; align-items: center; justify-content: center; flex: none;
            width: 1.35em; height: 1.35em; border-radius: 50%;
            background: color-mix(in srgb, var(--cap) 30%, #05070a);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cap) 55%, transparent);
        }
        .cap img.icoon { width: 0.95em; height: 0.95em; object-fit: contain; }
        .cap:not(:has(.icoon-rond))::before {
            content: ''; display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%;
            background: var(--cap); vertical-align: 0.05em;
        }

        /* ---------- Eerdere meldingen ---------- */
        .eerder { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        #lijst { flex: 1; min-height: 0; overflow: hidden; }
        .dagkop {
            display: flex; align-items: center; gap: 0.8em;
            color: var(--dim); font-size: 0.8em; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.12em;
            padding: 0.9em 0 0.45em;
        }
        .dagkop:first-child { padding-top: 0; }
        .dagkop::after { content: ''; flex: 1; height: 1px; background: var(--line); }
        .rij {
            display: grid;
            /* Vaste breedte voor de bronkolom (i.p.v. "auto") zodat het icoon altijd op dezelfde
             * plek staat, ongeacht of het label "Politie" of "VR ZAW" is — anders schuift het
             * icoon mee met de tekstbreedte en staan politie/brandweer niet recht onder elkaar. */
            grid-template-columns: 4.6em minmax(0, 1fr) 9em;
            align-items: center;
            gap: 0 1.2em;
            padding: 0.55em 1.2em 0.55em 1em;
            border-left: 0.3em solid var(--cap, var(--line));
            border-radius: 0.3em;
        }
        .rij.alt { background: var(--panel); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035); }
        .rij .t { font-size: 1.35em; font-weight: 800; font-variant-numeric: tabular-nums; }
        .rij .body { min-width: 0; }
        .rij .txt {
            font-size: 1.3em; font-weight: 600; line-height: 1.3;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }
        .rij .caps { display: flex; flex-wrap: wrap; gap: 0.4em 1.2em; font-size: 0.95em; justify-content: flex-start; }

        .empty {
            color: var(--muted); font-size: 1.5em; text-align: center; padding: 1.5em;
            grid-column: 1 / -1;
        }
        .empty small { display: block; font-size: 0.6em; margin-top: 0.8em; white-space: pre-line; line-height: 1.5; }

        /* ---------- Telefoon/smal scherm ----------
         * Het hoofddoel is en blijft een tv via Chromecast (vandaar de vw-schaling en de vaste,
         * niet-scrollende lijst hierboven), maar de pagina wordt ook weleens op een telefoon
         * bekeken om snel te checken. Onder deze breedte schakelt de opmaak om naar een gewone,
         * verticaal scrollende pagina met een compactere, gestapelde indeling.
         */
        @media (max-width: 820px) {
            body {
                font-size: clamp(15px, 4.2vw, 19px);
                overflow-y: auto; overflow-x: hidden;
                height: auto; min-height: 100%;
                cursor: auto;
            }
            header { flex-wrap: wrap; row-gap: 0.6em; padding: 0.9em 5vw; }
            .status { max-width: 100%; order: 2; }
            .clock { order: 1; width: 100%; justify-content: space-between; }
            .clock .time { font-size: 1.5em; }

            main { padding: 1.1em 5vw 2.5em; gap: 1.3em; overflow: visible; }

            .hero { grid-template-columns: 1fr; gap: 0.9em 0; padding: 1.1em 1.3em; }
            .hero .when {
                display: flex; align-items: baseline; gap: 0.8em;
                border-right: none; border-bottom: 1px solid var(--line);
                padding-right: 0; padding-bottom: 0.8em;
            }
            .hero .when .t { font-size: 2em; }
            .hero .when .ago, .hero .when .dag { margin-top: 0; }
            .hero .msg { font-size: 1.4em; -webkit-line-clamp: 5; }

            .eerder { flex: none; }
            #lijst { flex: none; overflow: visible; }
            .rij {
                grid-template-columns: auto minmax(0, 1fr);
                grid-template-areas: "tijd caps" "txt txt";
                row-gap: 0.3em;
                padding: 0.7em 1em;
            }
            .rij .t { grid-area: tijd; }
            .rij .body { grid-area: txt; }
            /* Vaste breedte, ook hier: anders schuift het icoon mee met de labeltekst
             * ("Politie" vs "VR ZAW") en staan politie/brandweer niet recht onder elkaar. */
            .rij .caps { grid-area: caps; justify-self: end; width: 8em; }
            .rij .txt {
                font-size: 1.05em; white-space: normal; text-overflow: clip;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            }
        }

        /* ---------- Diagnose (?debug) ---------- */
        #debug {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; overflow: auto;
            background: rgba(5, 7, 10, 0.96); padding: 1.5em 2.2vw; font-size: 0.8em;
        }
        #debug h2 { margin: 0 0 0.6em; }
        #debug h3 { margin: 1.4em 0 0.4em; color: var(--muted); }
        #debug .fout { color: var(--prio1); }
        #debug table { border-collapse: collapse; width: 100%; }
        #debug td { padding: 0.3em 0.8em 0.3em 0; border-bottom: 1px solid var(--line); vertical-align: top; }
        #debug td:first-child { white-space: nowrap; color: var(--muted); }
        #debug td:last-child { white-space: nowrap; }
    </style>
</head>
<body>
    <header>
        <div class="status">
            <span class="dot" id="dot"></span>
            <span class="status-tekst"><span id="statusTekst">Verbinden…</span><span id="statusDetail"></span></span>
        </div>
        <div class="clock">
            <span class="date" id="datum"></span>
            <span class="time" id="tijd">00:00:00</span>
        </div>
    </header>

    <main>
        <section>
            <div class="kop">Laatste melding</div>
            <article class="hero" id="hero">
                <div class="empty">Meldingen ophalen…</div>
            </article>
        </section>

        <section class="eerder">
            <div class="kop">Eerdere meldingen</div>
            <div id="lijst"></div>
        </section>
    </main>

    <script>
        /* ================= Instellingen =================
         * Capcodes met een eigen label en kleur, als hun nummer in een melding staat.
         * Alle meldingen uit beide feeds (zie FEEDS) worden getoond, behalve ambulancemeldingen (zie isAmbulance).
         */
        // 0127850 (politie-persalarm) staat er bewust niet meer bij: dat capcode-label zei
        // ook al gewoon "Politie", identiek aan het bronlabel ernaast — dat gaf "Politie Politie".
        // De drie voorlichters zijn van de brandweer, vandaar allemaal brandweerrood (--brandweer).
        const CAPCODES = [
            { code: '0104972', naam: 'VR ZAW', kleur: 'var(--brandweer)' },
            { code: '0127185', naam: 'VR KEN', kleur: 'var(--brandweer)' },
            { code: '0205625', naam: 'VR NHN', kleur: 'var(--brandweer)' },
        ];
        // Alle feeds worden opgehaald en samengevoegd; valt er één uit, dan komen de andere nog door.
        // Dezelfde melding uit meerdere feeds wordt één keer getoond, met alle bronnen erbij.
        // 'dienst' + 'kleur': het label dat bij elke melding uit die feed komt te staan.
        // (alarmeringen.nl is er bewust uit: alarmeringdroid + 112hier.nl dekken dezelfde politiemeldingen al.)
        const FEEDS = [
            { naam: 'alarmeringdroid', url: 'https://www.alarmeringdroid.nl/rss/7738690e', dienst: 'Politie', kleur: 'var(--politie)' },
            { naam: 'voorlichter Zaanstreek-Waterland', url: 'https://www.alarmeringdroid.nl/rss/5ef7e920', dienst: 'VR ZAW', kleur: 'var(--brandweer)' },
            { naam: 'voorlichter Kennemerland', url: 'https://www.alarmeringdroid.nl/rss/132e8974', dienst: 'VR KEN', kleur: 'var(--brandweer)' },
            { naam: 'voorlichter Noord-Holland-Noord', url: 'https://www.alarmeringdroid.nl/rss/6fa78810', dienst: 'VR NHN', kleur: 'var(--brandweer)' },
            { naam: 'alarmeringdroid politie (2)', url: 'https://www.alarmeringdroid.nl/rss/a067947f', dienst: 'Politie', kleur: 'var(--politie)' },
            // 112hier.nl filtert hier zelf al per capcode (zie CAPCODES hierboven), dus per
            // capcode komt daar een eigen, al gefilterde feed vandaan.
            { naam: '112hier.nl', url: 'https://112hier.nl/feed.json?capcodes=0127850', dienst: 'Politie', kleur: 'var(--politie)', formaat: '112hier' },
            { naam: '112hier.nl (voorlichter Zaanstreek-Waterland)', url: 'https://112hier.nl/feed.json?capcodes=0104972', dienst: 'VR ZAW', kleur: 'var(--brandweer)', formaat: '112hier' },
            { naam: '112hier.nl (voorlichter Kennemerland)', url: 'https://112hier.nl/feed.json?capcodes=0127185', dienst: 'VR KEN', kleur: 'var(--brandweer)', formaat: '112hier' },
            { naam: '112hier.nl (voorlichter Noord-Holland-Noord)', url: 'https://112hier.nl/feed.json?capcodes=0205625', dienst: 'VR NHN', kleur: 'var(--brandweer)', formaat: '112hier' },
        ];
        const VERVERS_MS = 60 * 1000;          // nieuwe meldingen ophalen
        // 112hier.nl staat tot 30 verzoeken/minuut toe (anders 429). Vier 112hier-feeds elke 10 s
        // is 24 verzoeken/minuut, ruim binnen die marge, en zes keer zo snel als de rest van de minuut.
        const SNEL_MS = 10 * 1000;
        const OPNIEUW_MS = 20 * 1000;          // na een mislukte poging sneller opnieuw proberen
        const NIEUW_MS = 5 * 60 * 1000;        // melding telt als "nieuw" (knipperend label)
        const CACHE_KEY = 'p2000-persalarm-v13';
        // Diagnose: open de pagina met ?debug om per melding te zien of en waarom hij (niet) getoond wordt
        const DEBUG = /[?&]debug\b/.test(location.search);
        const TZ = 'Europe/Amsterdam';          // tijden altijd in Nederlandse tijd, ook als de Chromecast op UTC staat
        // Boven deze breedte: vaste, niet-scrollende tv-indeling (zie CSS-media query hierboven
        // voor het omslagpunt eronder). .matches wordt live bijgehouden bij resize/draaien.
        const TV_INDELING = matchMedia('(min-width: 820px)');

        /* Een browser mag een feed van een andere site alleen lezen als die site dat toestaat (CORS).
         * Daarom proberen we een reeks routes; de route die werkt wordt onthouden en voortaan eerst gebruikt.
         * 1. Eigen server (server.py) — alleen als deze pagina via die server geopend is. Meest betrouwbaar.
         * 2. Rechtstreeks — werkt als de feed-site CORS toestaat.
         * 3. Publieke proxies en RSS-naar-JSON diensten.
         */
        const enc = encodeURIComponent;
        const routes = [
            { naam: 'eigen server', url: (u, i) => 'feed?bron=' + i, alleenViaServer: true, timeout: 15000 },
            // Eigen Vercel-functie (api/feed.js): haalt de feed server-naar-server op, dus zonder
            // CORS-beperking en zonder afhankelijkheid van een wisselvallige gratis proxy van derden.
            // Bestaat die niet (pagina niet op Vercel, of lokaal geopend), dan faalt dit gewoon en
            // valt de pagina door naar de volgende route. Geen cache-buster: die functie cacht de
            // feed zelf 20 s op Vercel's rand, wat de bron minder belast (delen tussen kijkers/tabs).
            // Voor traag antwoordende bronnen (time-out): eigen server en eigen proxy krijgen meer
            // tijd dan de externe gratis proxies, want die mogen bij twijfel juist snel doorschuiven.
            { naam: 'eigen proxy', url: u => '/api/feed?url=' + enc(u), geenBuster: true, alleenHttp: true, timeout: 15000 },
            { naam: 'rechtstreeks', url: u => u },
            { naam: 'allorigins', url: u => 'https://api.allorigins.win/raw?url=' + enc(u) },
            { naam: 'allorigins-json', url: u => 'https://api.allorigins.win/get?url=' + enc(u), lees: d => d.contents },
            { naam: 'codetabs', url: u => 'https://api.codetabs.com/v1/proxy?quest=' + enc(u) },
            { naam: 'cors.lol', url: u => 'https://api.cors.lol/?url=' + enc(u) },
            { naam: 'whateverorigin', url: u => 'https://whateverorigin.org/get?url=' + enc(u), lees: d => d.contents },
            // Jina AI Reader: leest een willekeurige URL en geeft de inhoud terug, zonder CORS-
            // beperking en zonder API-sleutel. Andere aanpak dan de proxies hierboven (geen eigen
            // CORS-header nodig van de bron), dus een goede extra kans als een feed structureel
            // blijft haperen via alle andere routes.
            { naam: 'jina-reader', url: u => 'https://r.jina.ai/' + u, timeout: 15000 },
            // Noodroute: gratis rss2json geeft max. 10 meldingen en ververst ongeveer eens per uur
            { naam: 'rss2json', url: u => 'https://api.rss2json.com/v1/api.json?rss_url=' + enc(u), rss2json: true, nood: true },
        ].filter(r => (!r.alleenViaServer && !r.alleenHttp) || /^https?:$/.test(location.protocol));

        const $ = id => document.getElementById(id);

        let meldingen = [];
        let laatsteSucces = null;

        /* ================= Klok ================= */
        function tik() {
            const nu = new Date();
            $('tijd').textContent = nu.toLocaleTimeString('nl-NL', { timeZone: TZ });
            const d = nu.toLocaleDateString('nl-NL', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            $('datum').textContent = d.charAt(0).toUpperCase() + d.slice(1);
        }
        tik();
        setInterval(tik, 1000);

        /* ================= Ophalen ================= */
        // Per feed onthouden welke route werkte
        FEEDS.forEach(f => {
            f.routeKey = 'p2000-route-' + f.url;
            try { f.voorkeur = localStorage.getItem(f.routeKey); } catch (e) { f.voorkeur = null; }
            if (f.voorkeur === 'rss2json') f.voorkeur = null;
        });

        async function probeer(route, feed, i) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), route.timeout || 8000);
            try {
                let url = route.url(feed.url, i);
                // Cache-buster alleen op proxy-adressen, niet op de feed zelf en niet op de eigen
                // Vercel-proxy (die cacht bewust zelf, zie routes hierboven)
                if (url !== feed.url && !route.geenBuster) url += (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);

                if (feed.formaat === '112hier') {
                    const tekst = route.lees ? route.lees(await res.json()) : await res.text();
                    let d;
                    try { d = JSON.parse(tekst); } catch (e) { throw new Error('antwoord is geen geldige JSON'); }
                    if (!Array.isArray(d.meldingen)) throw new Error('antwoord is geen 112hier-feed');
                    return lees112Hier(d.meldingen);
                }
                if (route.rss2json) {
                    const d = await res.json();
                    if (d.status !== 'ok' || !Array.isArray(d.items)) throw new Error(d.message || 'geen feed');
                    return d.items.map(i => ({
                        titel: i.title, beschrijving: i.description || i.content,
                        categorie: (i.categories || []).join(' '),
                        // rss2json geeft "2026-09-27 04:41:00" in UTC
                        ruweDatum: /^\d{4}-\d\d-\d\d \d/.test(i.pubDate || '') ? i.pubDate.replace(' ', 'T') + 'Z' : i.pubDate,
                        id: i.guid || i.link,
                        alles: JSON.stringify(i),           // hele item, om capcodes in te zoeken
                    }));
                }
                const tekst = route.lees ? route.lees(await res.json()) : await res.text();
                if (!tekst || !/<(rss|feed|rdf:RDF|channel)[\s>]/i.test(tekst)) throw new Error('antwoord is geen feed');
                return leesXml(tekst);
            } catch (e) {
                throw new Error(e.name === 'AbortError' ? 'time-out' : (e.message === 'Failed to fetch' ? 'geblokkeerd' : e.message));
            } finally {
                clearTimeout(timer);
            }
        }

        async function haalFeed(feed, i) {
            const volgorde = [...routes].sort((a, b) => (b.naam === feed.voorkeur) - (a.naam === feed.voorkeur));
            const fouten = [];
            for (const route of volgorde) {
                try {
                    const items = await probeer(route, feed, i);
                    if (route.naam !== feed.voorkeur && !route.nood) {
                        feed.voorkeur = route.naam;
                        try { localStorage.setItem(feed.routeKey, route.naam); } catch (e) { /* geen opslag */ }
                    }
                    return { items, route: route.naam };
                } catch (e) {
                    console.warn(feed.naam, 'route mislukt:', route.naam, e.message);
                    fouten.push(route.naam + ': ' + e.message);
                }
            }
            // Faalden alle routes voor deze feed, dan is een opsomming van alle 9 pogingen te veel
            // voor op de tv. 'kort' is de reden die het vaakst voorkwam (vaak de eigenlijke oorzaak,
            // bv. HTTP 403 bij een blokkade); 'volledig' blijft bewaard voor diagnose (?debug).
            const tellingen = {};
            fouten.forEach(f => { const reden = f.slice(f.indexOf(': ') + 2); tellingen[reden] = (tellingen[reden] || 0) + 1; });
            const [kort] = Object.entries(tellingen).sort((a, b) => b[1] - a[1])[0] || ['onbekende fout'];
            const fout = new Error(kort);
            fout.volledig = fouten.join(' · ');
            throw fout;
        }

        function stripHtml(html) {
            const doc = new DOMParser().parseFromString(html || '', 'text/html');
            return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
        }

        // Tijd zoals op een Nederlandse klok (jaar, maand 0-11, dag, uur, min, sec) → tijdstip in ms
        const tzDelen = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23',
            year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' });
        function tzVerschil(ms) {
            const d = {}; tzDelen.formatToParts(new Date(ms)).forEach(p => { d[p.type] = +p.value; });
            return Date.UTC(d.year, d.month - 1, d.day, d.hour % 24, d.minute, d.second) - ms;
        }
        function alsNL(j, mnd, dag, u, min, sec) {
            const gok = Date.UTC(j, mnd, dag, u, min, sec || 0);
            return gok - tzVerschil(gok - tzVerschil(gok));
        }

        /* Datum uit de feed halen: RFC-822/ISO (pubDate, dc:date, Atom) of Nederlandse notatie in de tekst.
         * Staat er geen tijdzone bij, dan is het Nederlandse tijd (niet de tijdzone van de Chromecast).
         */
        const HEEFT_ZONE = /(Z|[+-]\d\d:?\d\d|\b(GMT|UTC|UT|CET|CEST|[ECMP][SD]T)\b)\s*$/i;
        function leesDatum(...kandidaten) {
            for (const k of kandidaten) {
                if (!k) continue;
                const d = new Date(k);
                if (!isNaN(d)) {
                    if (HEEFT_ZONE.test(k.trim())) return d.getTime();
                    return alsNL(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds());
                }
                const nl = k.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
                if (nl) {
                    const jaar = nl[3].length === 2 ? 2000 + +nl[3] : +nl[3];
                    return alsNL(jaar, nl[2] - 1, +nl[1], +nl[4], +nl[5], +(nl[6] || 0));
                }
            }
            return null;
        }

        // XML (RSS of Atom) omzetten naar ruwe items
        function leesXml(xml) {
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            if (doc.querySelector('parsererror')) throw new Error('feed kon niet worden gelezen');

            // RSS gebruikt <item>, Atom gebruikt <entry>
            const items = [...doc.getElementsByTagName('item'), ...doc.getElementsByTagName('entry')];
            return items.map(item => {
                const get = naam => {
                    for (const n of naam.split('|')) {
                        const e = item.getElementsByTagName(n)[0];
                        if (e && e.textContent.trim()) return e.textContent.trim();
                    }
                    return '';
                };
                const linkEl = item.getElementsByTagName('link')[0];
                const link = get('link') || (linkEl && linkEl.getAttribute('href')) || '';
                return {
                    titel: get('title'),
                    beschrijving: get('description|summary|content|content:encoded'),
                    ruweDatum: get('pubDate|dc:date|published|updated|date'),
                    categorie: [...item.getElementsByTagName('category')].map(c => c.textContent || c.getAttribute('term') || '').join(' '),
                    // hele item (alle velden, links en attributen), om capcodes in te zoeken
                    alles: new XMLSerializer().serializeToString(item),
                    id: get('guid|id') || link,
                };
            });
        }

        // 112hier.nl geeft een gestructureerde JSON-feed. Het filter op onze capcode (0127850)
        // gebeurt al door 112hier.nl zelf via ?capcodes=... in de feed-URL hierboven, dus hier
        // alleen nog omzetten naar de vorm die de rest van de pagina verwacht.
        function lees112Hier(meldingen) {
            return meldingen.map(m => ({
                titel: m.bericht || m.leesbaar || '',
                beschrijving: m.leesbaar || '',
                categorie: [m.dienst, m.urgentie, ...(m.capcodes || [])].filter(Boolean).join(' '),
                ruweDatum: m.ontvangen,
                id: m.id != null ? String(m.id) : (m.url || ''),
                alles: JSON.stringify(m),   // hele item, om capcodes in te zoeken
            }));
        }

        // Ruwe items omzetten naar meldingen voor het scherm
        function verwerk(ruw, feed) {
            return ruw.map(r => {
                const beschrijving = stripHtml(r.beschrijving);
                const titel = stripHtml(r.titel) || beschrijving;
                const tijd = leesDatum(r.ruweDatum, titel, beschrijving);
                return {
                    // id per feed: twee feeds kunnen hetzelfde nummer voor verschillende meldingen gebruiken
                    id: feed.naam + ':' + (r.id || titel + (r.ruweDatum || '')),
                    bron: feed.naam,
                    // Welke dienst(en) deze melding aanleverden ("Politie", "Voorlichter van dienst ..."),
                    // met kleur. Bij dedup worden de bronnen van meerdere feeds samengevoegd (zie ontdubbel).
                    bronnen: [{ naam: feed.dienst, kleur: feed.kleur }],
                    titel,
                    // Tekst voor op het scherm: zonder de 7-cijferige capcodes
                    tekst: titel.replace(/\b\d{7}\b/g, '').replace(/\s+/g, ' ').trim() || titel,
                    beschrijving,
                    categorie: stripHtml(r.categorie),
                    tijd: tijd == null ? Date.now() : tijd,
                    geenDatum: tijd == null,
                    capcodes: welkeCapcodes([titel, beschrijving, r.categorie, r.alles].join(' ')),
                };
            });
        }

        /* Dezelfde melding kan in beide feeds staan (met een ander id).
         * Zelfde tekst (zonder capcodes, spaties en leestekens) binnen 10 minuten = dezelfde melding.
         * Staat de ene tekst helemaal in de andere en zijn ze ongeveer even lang (min. 80%), dan telt dat ook.
         * Zo valt een vervolgmelding als "... Haarlem Nacontrole" niet weg.
         */
        const sleutel = m => (m.tekst || m.titel).toLowerCase().replace(/\b\d{7}\b/g, '').replace(/[^a-z0-9]/g, '');
        function ontdubbel(lijst) {
            const uniek = [];
            for (const m of [...lijst].sort((a, b) => b.tijd - a.tijd)) {
                const k = sleutel(m);
                const lijkt = (x, y) => x === y || (Math.min(x.length, y.length) >= 15 &&
                    Math.min(x.length, y.length) >= 0.8 * Math.max(x.length, y.length) && (x.includes(y) || y.includes(x)));
                const dubbel = k.length >= 4 && uniek.find(u => Math.abs(u.tijd - m.tijd) < 10 * 60 * 1000 && lijkt(u.sleutel, k));
                if (dubbel) {
                    // Capcodes en bronnen van beide samenvoegen (geen dubbele bronnaam, bv. 2x "Politie")
                    dubbel.capcodes = [...new Set([...(dubbel.capcodes || []), ...(m.capcodes || [])])];
                    const bekendeNamen = new Set((dubbel.bronnen || []).map(b => b.naam));
                    for (const b of m.bronnen || []) if (!bekendeNamen.has(b.naam)) { dubbel.bronnen.push(b); bekendeNamen.add(b.naam); }
                } else {
                    uniek.push({ ...m, sleutel: k });
                }
            }
            return uniek;
        }

        /* Ambulancemeldingen eruit, bv. "A2 (dia: ja) 12167 Rit 145306 IJweg Nieuw-Vennep".
         * Filter is bewust smal: alleen een ritnummer ("Rit 145306") in de meldingstekst zelf
         * (niet in de omschrijving, want daar staan bij een gezamenlijke alarmering ook
         * ambulance-eenheden). Eerdere, bredere varianten filterden ook politiemeldingen weg.
         */
        const AMBULANCE = /\brit\s*\d{4,}\b/i;
        function isAmbulance(m) {
            return AMBULANCE.test(m.titel);
        }

        // Welke van onze capcodes staan in de tekst (ook zonder voorloopnul)?
        function welkeCapcodes(tekst) {
            return CAPCODES
                .filter(c => new RegExp('\\b0*' + c.code.replace(/^0+/, '') + '\\b').test(tekst))
                .map(c => c.code);
        }
        const capInfo = code => CAPCODES.find(c => c.code === code);

        /* ================= Interpretatie ================= */
        function geleden(ms) {
            const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
            if (s < 60) return 'zojuist';
            const m = Math.floor(s / 60);
            if (m < 60) return m + ' min geleden';
            const u = Math.floor(m / 60);
            if (u < 24) return u + ' uur ' + (m % 60) + ' min geleden';
            const d = Math.floor(u / 24);
            return d === 1 ? 'gisteren' : d + ' dagen geleden';
        }

        const fmtTijd = ms => new Date(ms).toLocaleTimeString('nl-NL', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
        const dagVan = ms => new Date(ms).toLocaleDateString('nl-NL', { timeZone: TZ });
        function fmtDag(ms) {
            const nu = Date.now();
            if (dagVan(ms) === dagVan(nu)) return 'Vandaag';
            if (dagVan(ms) === dagVan(nu - 864e5)) return 'Gisteren';
            return new Date(ms).toLocaleDateString('nl-NL', { timeZone: TZ, day: 'numeric', month: 'short' });
        }

        /* ================= Weergave ================= */
        function leeg(e) { while (e.firstChild) e.removeChild(e.firstChild); }

        function el(tag, cls, tekst) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (tekst != null) e.textContent = tekst;
            return e;
        }

        /* Officiële beeldmerken per dienst (het witte politielogo, het gouden brandweerlogo),
         * zodat een label ook vanaf de bank in één oogopslag te herkennen is, niet pas na het
         * lezen van de tekst. Losse bestanden met transparante achtergrond, zie /icons. */
        function icoonVoor(naam) {
            if (naam === 'Politie') return 'icons/politie.png';
            if (naam && naam.startsWith('VR ')) return 'icons/brandweer.png';
            return null;
        }
        // Eén label-span met icoon + tekst, in de kleur van de dienst/capcode
        function capEl(cls, naam, kleur) {
            const e = el('span', cls);
            e.style.setProperty('--cap', kleur);
            const src = icoonVoor(naam);
            if (src) {
                const rond = el('span', 'icoon-rond');
                const img = el('img', 'icoon');
                img.src = src;
                img.alt = '';
                rond.appendChild(img);
                e.appendChild(rond);
            }
            e.appendChild(document.createTextNode(naam));
            return e;
        }

        // Bron van de melding als gekleurd label met icoon ("Politie", "VR ZAW", ...)
        function bronLabels(m, parent) {
            for (const b of m.bronnen || []) parent.appendChild(capEl('cap bron', b.naam, b.kleur));
        }
        // Capcode-namen als gekleurd label (zeldzaam: de capcode moet toevallig in de tekst staan)
        function capLabels(m, parent) {
            for (const code of m.capcodes || []) {
                const c = capInfo(code);
                if (c) parent.appendChild(capEl('cap capcode', c.naam, c.kleur));
            }
        }
        const isNieuw = m => Date.now() - m.tijd < NIEUW_MS;

        // Randkleur van de (eerste) capcode van de melding
        function kleur(e, m) {
            // Capcode is specifieker als die er toevallig is; anders de kleur van de bron(nen)
            const c = capInfo((m.capcodes || [])[0]) || (m.bronnen || [])[0];
            if (c) e.style.setProperty('--cap', c.kleur);
        }

        function renderHero() {
            const hero = $('hero');
            leeg(hero);
            hero.className = 'hero';
            hero.style.removeProperty('--cap');

            if (!meldingen.length) {
                hero.appendChild(el('div', 'empty', 'Nog geen meldingen'));
                return;
            }

            const m = meldingen[0];
            kleur(hero, m);
            if (isNieuw(m)) hero.classList.add('fresh');

            const when = el('div', 'when');
            when.appendChild(el('div', 't', fmtTijd(m.tijd)));
            when.appendChild(el('div', 'ago', geleden(m.tijd)));
            when.appendChild(el('div', 'dag', fmtDag(m.tijd)));
            hero.appendChild(when);

            const inhoud = el('div', 'inhoud');
            const tags = el('div', 'tags');
            if (isNieuw(m)) tags.appendChild(el('span', 'badge nieuw', 'NIEUW'));
            bronLabels(m, tags);
            capLabels(m, tags);
            if (tags.childElementCount) inhoud.appendChild(tags);
            inhoud.appendChild(el('div', 'msg', m.tekst || m.titel));
            hero.appendChild(inhoud);
        }

        // Vaste lijst zonder scrollen: rijen die niet meer helemaal passen vallen onderaan weg
        function passend(lijst) {
            const onder = lijst.getBoundingClientRect().bottom;
            for (const e of [...lijst.children].reverse()) {
                if (e.getBoundingClientRect().bottom <= onder + 1) break;
                e.remove();
            }
            // Geen dagkopje onderaan laten staan zonder meldingen eronder
            while (lijst.lastElementChild && lijst.lastElementChild.classList.contains('dagkop')) lijst.lastElementChild.remove();
        }

        function renderLijst() {
            const lijst = $('lijst');
            leeg(lijst);
            lijst.style.fontSize = '';   // terug naar de standaardschaal vóór het meten hieronder
            const rest = meldingen.slice(1, 40);

            if (!rest.length) {
                lijst.appendChild(el('div', 'empty', 'Geen eerdere meldingen'));
                return;
            }

            let vorigeDag = null, n = 0;
            for (const m of rest) {
                const dag = fmtDag(m.tijd);
                if (dag !== vorigeDag) {
                    lijst.appendChild(el('div', 'dagkop', dag));
                    vorigeDag = dag;
                }

                const rij = el('div', 'rij' + (n++ % 2 ? ' alt' : ''));
                kleur(rij, m);
                rij.appendChild(el('div', 't', fmtTijd(m.tijd)));

                const body = el('div', 'body');
                body.appendChild(el('div', 'txt', m.tekst || m.titel));
                rij.appendChild(body);
                const caps = el('div', 'caps');
                bronLabels(m, caps);
                capLabels(m, caps);
                rij.appendChild(caps);
                rij.setAttribute('data-id', m.id);

                lijst.appendChild(rij);
            }

            // Op een tv (vaste, niet-scrollende lijst): veel meldingen -> onderaan afknippen;
            // weinig meldingen -> iets opschalen zodat de lijst het scherm netjes vult i.p.v. een
            // groot leeg vlak achter te laten, als een scorebord. (scrollHeight is hier geen
            // betrouwbare maat: die geeft bij kortere inhoud gewoon de containerhoogte terug.)
            // Op een telefoon scrollt de pagina gewoon (zie media query hierboven) en blijft dit
            // over aan het gewone documentverloop.
            if (!TV_INDELING.matches) return;
            const rect = lijst.getBoundingClientRect();
            const gebruikt = lijst.lastElementChild ? lijst.lastElementChild.getBoundingClientRect().bottom - rect.top : 0;
            if (gebruikt > rect.height) {
                passend(lijst);
            } else if (gebruikt > 0) {
                // 0.99 als kleine veiligheidsmarge: de schatting is lineair (gemeten bij schaal 1),
                // een fractie te veel zou de onderste rij net af laten snijden.
                const schaal = Math.min(1.6, (rect.height / gebruikt) * 0.99);
                lijst.style.fontSize = schaal.toFixed(3) + 'em';
            }
        }

        function renderStatus(fout, route, detail) {
            const dot = $('dot');
            const wanneer = ms => (fmtDag(ms) === 'Vandaag' ? '' : fmtDag(ms).toLowerCase() + ' ') + fmtTijd(ms);
            $('statusDetail').textContent = '';
            if (!fout) {
                dot.className = 'dot ok';
                $('statusTekst').textContent = 'Live · bijgewerkt ' + fmtTijd(laatsteSucces) + (route ? ' · ' + route : '');
                if (detail) $('statusDetail').textContent = detail;   // volle routelijst en/of welke feed(s) falen
                return;
            }
            dot.className = laatsteSucces ? 'dot warn' : 'dot err';
            $('statusTekst').textContent = laatsteSucces
                ? 'Geen verbinding · laatst bijgewerkt ' + wanneer(laatsteSucces) + ' · nieuwe poging over ' + OPNIEUW_MS / 1000 + ' s'
                : 'Geen verbinding met de feed';
            // Per route wat er misging, zodat de oorzaak op het scherm te lezen is
            if (detail) $('statusDetail').textContent = detail;
        }

        // Diagnose (?debug): elke melding uit beide feeds met de reden waarom hij wel/niet op het scherm staat
        function renderDebug() {
            if (!DEBUG || !laatsteRonde) return;
            let paneel = $('debug');
            if (!paneel) { paneel = el('div'); paneel.id = 'debug'; document.body.appendChild(paneel); }
            leeg(paneel);
            const opScherm = {};
            document.querySelectorAll('#lijst .rij').forEach(e => { opScherm[e.getAttribute('data-id')] = true; });
            const plek = {}; meldingen.forEach((m, i) => { plek[m.id] = i; });
            paneel.appendChild(el('h2', null, 'Diagnose · ' + fmtTijd(Date.now()) + ' · ' + meldingen.length + ' meldingen in geheugen'));
            laatsteRonde.mislukt.forEach(m => paneel.appendChild(el('p', 'fout', 'Niet bereikbaar: ' + m.feed.naam + ' — ' + m.volledig)));
            for (const g of laatsteRonde.gelukt) {
                const items = laatsteRonde.alle.filter(m => m.bron === g.feed.naam);
                paneel.appendChild(el('h3', null, g.feed.naam + ' — via ' + g.route + ' — ' + items.length + ' meldingen in de feed'));
                const tabel = el('table');
                for (const m of items) {
                    let reden;
                    if (isAmbulance(m)) reden = '✗ weggefilterd: ambulance';
                    else if (Date.now() - m.tijd >= 30 * 864e5) reden = '✗ ouder dan 30 dagen';
                    else if (plek[m.id] === 0) reden = '✓ hoofdmelding';
                    else if (opScherm[m.id]) reden = '✓ in de lijst';
                    else if (plek[m.id] != null) reden = '… past niet meer op het scherm (plek ' + (plek[m.id] + 1) + ')';
                    else reden = '≡ samengevoegd met dezelfde melding uit de andere feed';
                    const tr = el('tr');
                    [fmtDag(m.tijd) + ' ' + fmtTijd(m.tijd), m.titel, (m.capcodes || []).join(' '), reden]
                        .forEach(t => tr.appendChild(el('td', null, t)));
                    tabel.appendChild(tr);
                }
                paneel.appendChild(tabel);
            }
        }

        function renderAlles() {
            renderHero();
            renderLijst();
        }

        /* ================= Cache (zodat de tv na een herstart direct iets toont) ================= */
        function laadCache() {
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                if (c && Array.isArray(c.meldingen)) {
                    meldingen = c.meldingen.filter(m => !isAmbulance(m));
                    laatsteSucces = c.tijd;
                }
            } catch (e) { /* geen opslag beschikbaar */ }
        }
        function bewaarCache() {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ tijd: laatsteSucces, meldingen: meldingen.slice(0, 100) }));
            } catch (e) { /* geen opslag beschikbaar */ }
        }

        /* ================= Hoofdlus ================= */
        // Elke feed heeft zijn eigen ritme (zie SNEL_MS/VERVERS_MS hierboven) en onthoudt zijn
        // eigen laatste resultaat, zodat een feed die nog niet weer aan de beurt is gewoon met
        // zijn laatst opgehaalde meldingen blijft meetellen.
        FEEDS.forEach(f => {
            f.interval = f.formaat === '112hier' ? SNEL_MS : VERVERS_MS;
            f.volgende = 0;          // eerste keer: meteen ophalen
            f.laatsteFout = null;    // { kort, volledig } zolang de laatste poging mislukte
            f.laatsteRoute = null;
            f.laatsteItems = [];     // ruwe items van de laatst gelukte poging
        });

        let bezig = false;
        let volgendeTimer;
        let laatsteRonde = null;
        async function ververs() {
            if (bezig) return;           // vorige poging loopt nog
            const nu = Date.now();
            const due = FEEDS.filter(f => nu >= f.volgende);
            if (due.length) {
                bezig = true;
                try {
                    // Zoals Promise.allSettled, maar ook in oudere tv-browsers
                    const resultaten = await Promise.all(due.map(f => haalFeed(f, FEEDS.indexOf(f)).then(
                        value => ({ status: 'fulfilled', value }), reason => ({ status: 'rejected', reason }))));
                    resultaten.forEach((res, i) => {
                        const feed = due[i];
                        if (res.status === 'fulfilled') {
                            feed.laatsteFout = null;
                            feed.laatsteRoute = res.value.route;
                            feed.laatsteItems = res.value.items;
                            feed.volgende = Date.now() + feed.interval;
                        } else {
                            feed.laatsteFout = { kort: res.reason.message, volledig: res.reason.volledig || res.reason.message };
                            feed.volgende = Date.now() + OPNIEUW_MS;
                        }
                    });

                    // "Gelukt" = laatste poging van díe feed was goed (ook als dat een vorige ronde was);
                    // een feed die nu net mislukt telt niet meer mee, ook al lukte hij eerder wel.
                    const gelukt = FEEDS.filter(f => !f.laatsteFout);
                    const mislukt = FEEDS.filter(f => f.laatsteFout);
                    if (!gelukt.length) {
                        // Kort per feed (bv. "HTTP 503"), niet de volledige route-voor-route lijst van
                        // alle feeds samen — dat werd onleesbaar breed nu er elf feeds zijn. De volledige
                        // lijst blijft beschikbaar via de console en ?debug.
                        const fout = new Error(mislukt.map(f => f.naam + ' (' + f.laatsteFout.kort + ')').join(', '));
                        fout.volledig = mislukt.map(f => f.naam + ' — ' + f.laatsteFout.volledig).join('\n');
                        throw fout;
                    }
                    const alleNieuw = gelukt.flatMap(f => verwerk(f.laatsteItems, f));
                    const nieuw = alleNieuw.filter(m => !isAmbulance(m));
                    laatsteRonde = {
                        gelukt: gelukt.map(f => ({ feed: f, route: f.laatsteRoute })),
                        mislukt: mislukt.map(f => ({ feed: f, kort: f.laatsteFout.kort, volledig: f.laatsteFout.volledig })),
                        alle: alleNieuw,
                    };
                    // Samenvoegen met wat we al hadden, zodat de historie niet verdwijnt als de feed kort is
                    const bekend = new Map(meldingen.map(m => [m.id, m]));
                    nieuw.forEach(m => {
                        // Zonder datum in de feed: tijdstip van eerste keer zien bewaren
                        const oud = bekend.get(m.id);
                        bekend.set(m.id, m.geenDatum && oud ? { ...m, tijd: oud.tijd } : m);
                    });
                    meldingen = ontdubbel([...bekend.values()]
                        .filter(m => Date.now() - m.tijd < 30 * 864e5 && !isAmbulance(m)));
                    laatsteSucces = Date.now();
                    bewaarCache();
                    renderAlles();
                    renderDebug();
                    // Alles gelukt: één korte regel, geen opsomming (dat maakt de balk onnodig groot).
                    // Bij een enkele/twee feeds mag de route erbij; bij veel feeds is dat te veel tekst.
                    const routeSamenvatting = mislukt.length ? gelukt.length + '/' + FEEDS.length + ' feeds'
                        : gelukt.length <= 2 ? 'via ' + gelukt.map(f => f.naam + ' (' + f.laatsteRoute + ')').join(' + ') : 'alle feeds';
                    // Bij een storing: per feed de kortst mogelijke reden (bv. 'HTTP 403'), zodat je in
                    // één regel ziet wat er misgaat. De volledige route-voor-route foutenlijst staat in
                    // de console en (per melding) in ?debug.
                    const opmerkingen = mislukt.length
                        ? [mislukt.map(f => f.naam + ' (' + f.laatsteFout.kort + ')').join(', ') + ' niet bereikbaar'] : [];
                    renderStatus(false, routeSamenvatting, opmerkingen.join(' · '));
                } catch (e) {
                    console.error(e.message + (e.volledig ? '\n' + e.volledig : ''));
                    if (!meldingen.length) {
                        const hero = $('hero');
                        hero.className = 'hero';
                        leeg(hero);
                        hero.appendChild(el('div', 'empty', '⚠️ Kan meldingen niet laden'));
                        hero.firstChild.appendChild(el('small', null,
                            e.message + '\n\nNieuwe poging over ' + OPNIEUW_MS / 1000 + ' s'));
                    }
                    renderStatus(true, null, e.message.replace(/\n/g, ' | '));
                } finally {
                    bezig = false;
                }
            }
            // Volgende keer checken zodra de eerstvolgende feed weer aan de beurt is
            clearTimeout(volgendeTimer);
            const wachttijd = Math.max(1000, Math.min(...FEEDS.map(f => f.volgende)) - Date.now());
            volgendeTimer = setTimeout(ververs, wachttijd);
        }

        // Na draaien/verkleinen van het scherm opnieuw bepalen hoeveel meldingen passen
        let resizeTimer;
        addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderLijst, 300); });

        // "x min geleden" en NIEUW-labels actueel houden tussen verversingen door
        setInterval(() => { if (meldingen.length) renderHero(); }, 30 * 1000);

        laadCache();
        if (meldingen.length) {
            renderAlles();
            // Net herladen: status van de vorige keer tonen i.p.v. kort 'geen verbinding'
            if (laatsteSucces && Date.now() - laatsteSucces < 3 * 60 * 1000) renderStatus(false);
            else renderStatus(true);
        }
        ververs();
    </script>
</body>
</html>
