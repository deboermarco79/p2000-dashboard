<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Capcode 0127850 Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1a3a 50%, #0f172a 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 40px;
            gap: 30px;
        }

        .header {
            text-align: center;
            border-bottom: 3px solid #ef4444;
            padding-bottom: 30px;
        }

        .header h1 {
            font-size: 4em;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ff3333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 1.3em;
            color: #a0aec0;
            font-weight: 500;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 20px;
            font-size: 1em;
            color: #22c55e;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .alerts-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
        }

        .alert-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            border: 2px solid rgba(148, 163, 184, 0.2);
            border-left: 5px solid #ef4444;
            border-radius: 12px;
            padding: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .alert-card:hover {
            transform: translateY(-8px);
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 20px 50px rgba(239, 68, 68, 0.2);
        }

        .alert-card.urgent {
            border-left-color: #ff0000;
            border-color: rgba(239, 68, 68, 0.5);
            background: linear-gradient(135deg, rgba(127, 29, 29, 0.4), rgba(78, 22, 22, 0.4));
            animation: urgentPulse 1.5s infinite;
        }

        @keyframes urgentPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.2); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.4); }
        }

        .alert-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.1));
            border: 1px solid #dc2626;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            color: #fca5a5;
            margin-bottom: 15px;
        }

        .alert-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .alert-time {
            font-size: 1em;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .alert-time::before {
            content: '⏰';
            font-size: 1.1em;
        }

        .alert-location {
            font-size: 1.4em;
            font-weight: 600;
            color: #e0e7ff;
            margin-bottom: 12px;
        }

        .alert-description {
            font-size: 1em;
            color: #cbd5e1;
            line-height: 1.6;
            margin-top: 12px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            background: rgba(15, 23, 42, 0.5);
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .timestamp {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1em;
            color: #94a3b8;
        }

        .timestamp::before {
            content: '🕐';
            font-size: 1.3em;
        }

        .alert-count {
            font-size: 1.3em;
            font-weight: 700;
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            padding: 12px 25px;
            border-radius: 20px;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 40px;
            font-size: 1.5em;
            color: #94a3b8;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 40px;
        }

        .empty-state h3 {
            font-size: 1.8em;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1.1em;
            color: #64748b;
        }

        .error-banner {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.2), rgba(185, 28, 28, 0.2));
            border: 1px solid #dc2626;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            color: #fca5a5;
            font-size: 1.05em;
        }

        .alerts-container::-webkit-scrollbar {
            width: 8px;
        }

        .alerts-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .alerts-container::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }

        .alerts-container::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        @media (max-width: 1600px) {
            .dashboard {
                padding: 30px;
            }

            .header h1 {
                font-size: 3em;
            }

            .alert-card {
                padding: 25px;
            }
        }

        @media (max-width: 1280px) {
            .alerts-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🚨 P2000 MONITOR</h1>
            <p>Capcode: <strong>0127850</strong></p>
            <div class="status-indicator">
                <div class="pulse"></div>
                <span>Live monitoring actief</span>
            </div>
        </div>

        <div id="error-banner"></div>

        <div class="alerts-container" id="alerts">
            <div class="loading">⏳ Meldingen laden...</div>
        </div>

        <div class="footer">
            <div class="timestamp" id="timestamp">--:--</div>
            <div class="alert-count" id="count">0 meldingen</div>
        </div>
    </div>

    <script>
        const FEED_URL = 'http://alarmeringen.nl/feeds/user/e3826aac-12d9-4685-be9e-e30a469de97c.rss';
        const REFRESH_INTERVAL = 15000;
        const CAPCODE = '0127850';
        let lastAlerts = [];

        async function fetchAlerts() {
            try {
                // Probeer rechtstreeks de feed op te halen via CORS proxy
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(FEED_URL)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (!data.contents) {
                    throw new Error('Geen data ontvangen');
                }

                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, 'application/xml');

                if (xml.getElementsByTagName('parsererror').length) {
                    throw new Error('XML Parse Error');
                }

                const items = xml.getElementsByTagName('item');
                const alerts = [];

                for (let i = 0; i < Math.min(items.length, 8); i++) {
                    const item = items[i];
                    const title = item.getElementsByTagName('title')[0]?.textContent || '';
                    const description = item.getElementsByTagName('description')[0]?.textContent || '';
                    const pubDate = item.getElementsByTagName('pubDate')[0]?.textContent || '';

                    const time = new Date(pubDate).toLocaleTimeString('nl-NL', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const isBrand = title.toLowerCase().includes('brand');
                    const isUrgent = isBrand || title.toLowerCase().includes('grote');

                    alerts.push({
                        title: title.substring(0, 80),
                        description: cleanText(description).substring(0, 150),
                        time,
                        urgent: isUrgent,
                        category: isBrand ? 'Brand' : 'Overig'
                    });
                }

                clearError();
                displayAlerts(alerts);
                updateTime();

                if (alerts.length > lastAlerts.length) {
                    playAlert();
                }
                lastAlerts = alerts;

            } catch (error) {
                console.error('Fout:', error);
                showError('⚠️ Kan meldingen niet laden. Controleer je verbinding.');
            }
        }

        function cleanText(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function displayAlerts(alerts) {
            const container = document.getElementById('alerts');

            if (alerts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>✓ Geen meldingen</h3>
                        <p>Wachten op inkomende alarmen...</p>
                    </div>
                `;
                document.getElementById('count').textContent = '0 meldingen';
                return;
            }

            container.innerHTML = '';

            alerts.forEach((alert, i) => {
                const card = document.createElement('div');
                card.className = `alert-card ${alert.urgent ? 'urgent' : ''}`;
                card.innerHTML = `
                    <div>
                        <div class="alert-badge">
                            <span>${alert.urgent ? '🔴' : '⚪'} ${alert.category}</span>
                        </div>
                        <div class="alert-title">${escapeHtml(alert.title)}</div>
                        <div class="alert-time">${alert.time}</div>
                        ${alert.description ? `<div class="alert-description">${escapeHtml(alert.description)}</div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('count').textContent = `${alerts.length} meldingen`;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        } 

        function updateTime() {
            const now = new Date().toLocaleTimeString('nl-NL', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('timestamp').textContent = now;
        }

        function showError(msg) {
            document.getElementById('error-banner').innerHTML = `<div class="error-banner">${msg}</div>`;
        }

        function clearError() {
            document.getElementById('error-banner').innerHTML = '';
        }

        function playAlert() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                console.log('Audio niet beschikbaar');
            }
        }

        fetchAlerts();
        setInterval(fetchAlerts, REFRESH_INTERVAL);
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
