<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Monitor</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Verbergt de scrollbalk op de TV */
        }
        header {
            background-color: #1a1a1a;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #333;
        }
        h1 { margin: 0; font-size: 2.5rem; color: #4a90e2; }
        #clock { font-size: 2.5rem; font-weight: bold; }
        
        #container {
            padding: 20px 40px;
            height: calc(100vh - 120px);
            overflow-y: hidden; 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .melding {
            background-color: #222;
            border-left: 10px solid #555;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        /* Automatische kleurcodering op basis van dienst */
        .brandweer { border-left-color: #e74c3c; } /* Rood */
        .ambulance { border-left-color: #f1c40f; } /* Geel */
        .politie { border-left-color: #3498db; }   /* Blauw */
        
        .tijd { font-size: 1.5rem; color: #aaa; margin-bottom: 10px; font-weight: bold; }
        .tekst { font-size: 2rem; line-height: 1.3; }
        .error { color: #e74c3c; font-size: 2rem; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <h1>Actuele Alarmeringen</h1>
        <div id="clock">00:00:00</div>
    </header>
    
    <div id="container">
        <div class="error">Meldingen ophalen...</div>
    </div>

    <script>
        // De geüpdatete, veilige HTTPS RSS feed
        const feedUrl = 'https://alarmeringen.nl/feeds/user/e3826aac-12d9-4685-be9e-e30a469de97c.rss';
        const container = document.getElementById('container');
        
        // Geavanceerde lijst met proxies (mix van JSON wrappers en RAW text)
        const proxies = [
            { url: `https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`, type: 'json' },
            { url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(feedUrl)}`, type: 'raw' },
            { url: `https://corsproxy.io/?${encodeURIComponent(feedUrl)}`, type: 'raw' }
        ];
        
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('nl-NL');
        }, 1000);

        // Functie om de juiste kleur te bepalen
        function getDienstClass(tekst) {
            const lowerTekst = tekst.toLowerCase();
            if (lowerTekst.includes('brandweer') || lowerTekst.includes('brw') || lowerTekst.includes('prio 1') || lowerTekst.includes('prio 2')) return 'brandweer';
            if (lowerTekst.includes('ambulance') || lowerTekst.includes('ambu') || lowerTekst.includes('a1') || lowerTekst.includes('a2')) return 'ambulance';
            if (lowerTekst.includes('politie') || lowerTekst.includes('trauma') || lowerTekst.includes('lifeliner')) return 'politie';
            return '';
        }

        async function fetchWithFallback(proxyList) {
            for (let i = 0; i < proxyList.length; i++) {
                try {
                    const proxy = proxyList[i];
                    const response = await fetch(proxy.url, { cache: 'no-store' });
                    
                    if (response.ok) {
                        if (proxy.type === 'json') {
                            const data = await response.json();
                            // AllOrigins plaatst de broncode in de 'contents' variabele
                            if (data.contents) return data.contents;
                        } else {
                            return await response.text();
                        }
                    }
                } catch (error) {
                    console.warn(`Proxy ${i + 1} (${proxy.url}) mislukt, probeer de volgende...`);
                }
            }
            throw new Error('Alle proxy servers zijn onbereikbaar.');
        }

        async function laadMeldingen() {
            try {
                // Probeer de proxies op volgorde
                const rawXmlText = await fetchWithFallback(proxies);
                
                // Parse de ruwe XML direct in de browser
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(rawXmlText, "text/xml");
                
                // Controleer op parse-fouten
                const parseError = xmlDoc.querySelector("parsererror");
                if (parseError) throw new Error('Kon de RSS feed niet correct inlezen (XML Parse Error).');

                const items = xmlDoc.querySelectorAll("item");
                if (items.length === 0) throw new Error('Geen meldingen gevonden in de feed.');

                container.innerHTML = '';
                
                items.forEach(item => {
                    const el = document.createElement('div');
                    
                    const title = item.querySelector("title")?.textContent || "Geen details";
                    const pubDateStr = item.querySelector("pubDate")?.textContent;
                    
                    const datum = pubDateStr ? new Date(pubDateStr) : new Date();
                    const tijdString = datum.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) + ' - ' + datum.toLocaleDateString('nl-NL');
                    
                    const dienstClass = getDienstClass(title);
                    el.className = `melding ${dienstClass}`;
                    
                    el.innerHTML = `
                        <div class="tijd">${tijdString}</div>
                        <div class="tekst">${title}</div>
                    `;
                    container.appendChild(el);
                });
            } catch (error) {
                console.error('Fout bij het ophalen van meldingen:', error);
                container.innerHTML = '<div class="error">⚠️ Kan meldingen niet laden. <br><span style="font-size: 1rem; color: #aaa;">Probeer de pagina te verversen. <br>(' + error.message + ')</span></div>';
            }
        }

        let scrollPos = 0;
        setInterval(() => {
            const maxScroll = container.scrollHeight - container.clientHeight;
            if (maxScroll > 0) {
                scrollPos += container.clientHeight - 20; 
                if (scrollPos > maxScroll) scrollPos = 0; 
                container.scrollTo({ top: scrollPos, behavior: 'smooth' });
            }
        }, 12000); 

        // Starten
        laadMeldingen();
        setInterval(laadMeldingen, 120000); 
    </script>
</body>
</html>
