<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persalarm</title>
    <style>
        :root {
            --bg: #0a0d12;
            --panel: #121720;
            --panel-2: #181e29;
            --line: #232a36;
            --text: #eef1f6;
            --muted: #8a94a6;
            --dim: #5d6778;
            --prio1: #e5484d;
            --prio2: #f5a524;
            --prio3: #30a46c;
            --politie: #3e8ff0;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Alles schaalt mee met de schermbreedte: werkt op 720p, 1080p en 4K */
            font-size: clamp(14px, 1.15vw, 48px);
            overflow: hidden;
            cursor: none;
            display: flex; flex-direction: column;
        }

        /* ---------- Header ---------- */
        header {
            flex: none;
            display: flex; align-items: center; justify-content: space-between; gap: 2em;
            padding: 1.1em 2.2vw;
            border-bottom: 1px solid var(--line);
        }
        .status { display: flex; align-items: center; gap: 0.7em; color: var(--muted); min-width: 0; }
        #statusTekst { white-space: nowrap; }
        #statusDetail {
            display: block; font-size: 0.75em; margin-top: 0.25em; color: var(--dim);
            white-space: normal; max-width: 60vw;
        }
        .dot { flex: none; width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--muted); }
        .dot.ok { background: var(--prio3); box-shadow: 0 0 0.6em var(--prio3); }
        .dot.warn { background: var(--prio2); }
        .dot.err { background: var(--prio1); }
        .clock { display: flex; align-items: baseline; gap: 1em; white-space: nowrap; }
        .clock .time { font-size: 2.3em; font-weight: 700; font-variant-numeric: tabular-nums; }
        .clock .date { color: var(--muted); font-size: 1.1em; }

        /* ---------- Layout ---------- */
        main {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column; gap: 1.8em;
            padding: 1.6em 2.2vw 1.4em;
        }
        .kop {
            color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.14em;
            font-size: 0.85em; font-weight: 600;
            margin: 0 0 0.8em;
        }

        /* ---------- Laatste melding ---------- */
        .hero {
            display: grid;
            grid-template-columns: 10em 1fr;
            gap: 0 2.2em;
            align-items: center;
            background: var(--panel);
            border-left: 0.45em solid var(--cap, var(--politie));
            border-radius: 0.7em;
            padding: 1.5em 2em;
        }
        .hero.fresh { animation: pulse 1.8s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 transparent; }
            50% { box-shadow: 0 0 2.2em 0.1em color-mix(in srgb, var(--cap, var(--politie)) 45%, transparent); }
        }
        .hero .when { font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); padding-right: 1.6em; }
        .hero .when .t { font-size: 3.4em; font-weight: 700; line-height: 1; }
        .hero .when .ago { color: var(--text); font-size: 1.15em; margin-top: 0.5em; }
        .hero .when .dag { color: var(--muted); font-size: 1em; margin-top: 0.15em; }
        .hero .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em 0.7em; margin-bottom: 0.6em; }
        .hero .msg {
            font-size: 2.3em; font-weight: 650; line-height: 1.2;
            overflow-wrap: anywhere;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* ---------- Labels ---------- */
        .badge {
            display: inline-flex; align-items: center;
            padding: 0.25em 0.65em; border-radius: 0.35em;
            font-weight: 700; font-size: 0.95em; letter-spacing: 0.03em;
            background: var(--panel-2); color: var(--text); white-space: nowrap;
        }
        .hero .badge { font-size: 1.1em; }
        .badge.p1 { background: var(--prio1); }
        .badge.p2 { background: var(--prio2); color: #1a1200; }
        .badge.p3 { background: var(--prio3); }
        .badge.nieuw { background: #fff; color: #000; }
        .cap { color: var(--cap); font-weight: 600; white-space: nowrap; }
        .hero .cap { font-size: 1.15em; }
        .cap::before {
            content: ''; display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%;
            background: var(--cap); margin-right: 0.45em; vertical-align: 0.05em;
        }

        /* ---------- Eerdere meldingen ---------- */
        .eerder { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        #lijst { flex: 1; min-height: 0; overflow: hidden; }
        .dagkop {
            display: flex; align-items: center; gap: 0.8em;
            color: var(--dim); font-size: 0.8em; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.12em;
            padding: 0.9em 0 0.45em;
        }
        .dagkop:first-child { padding-top: 0; }
        .dagkop::after { content: ''; flex: 1; height: 1px; background: var(--line); }
        .rij {
            display: grid;
            grid-template-columns: 4.6em 5.4em 1fr;
            align-items: center;
            gap: 0 1.2em;
            padding: 0.7em 1.2em 0.7em 1em;
            border-left: 0.3em solid var(--cap, var(--line));
            border-radius: 0.3em;
        }
        .rij.alt { background: var(--panel); }
        .rij .t { font-size: 1.35em; font-weight: 700; font-variant-numeric: tabular-nums; }
        .rij .badge { font-size: 0.8em; padding: 0.2em 0.5em; }
        .rij .body { min-width: 0; }
        .rij .txt {
            font-size: 1.3em; line-height: 1.3;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }
        .rij .caps { display: flex; flex-wrap: wrap; gap: 0 1.4em; margin-top: 0.2em; font-size: 0.9em; }

        .empty {
            color: var(--muted); font-size: 1.5em; text-align: center; padding: 1.5em;
            grid-column: 1 / -1;
        }
        .empty small { display: block; font-size: 0.6em; margin-top: 0.8em; white-space: pre-line; line-height: 1.5; }
    </style>
</head>
<body>
    <header>
        <div class="status">
            <span class="dot" id="dot"></span>
            <span><span id="statusTekst">Verbinden…</span><span id="statusDetail"></span></span>
        </div>
        <div class="clock">
            <span class="date" id="datum"></span>
            <span class="time" id="tijd">00:00:00</span>
        </div>
    </header>

    <main>
        <section>
            <div class="kop">Laatste melding</div>
            <article class="hero" id="hero">
                <div class="empty">Meldingen ophalen…</div>
            </article>
        </section>

        <section class="eerder">
            <div class="kop">Eerdere meldingen</div>
            <div id="lijst"></div>
        </section>
    </main>

    <script>
        /* ================= Instellingen =================
         * Persalarmen voor deze capcodes, uit twee feeds tegelijk (zie FEEDS):
         */
        const CAPCODES = [
            { code: '0127850', naam: 'Politie Noord-Holland · Persalarm', kleur: '#3e8ff0' },
            { code: '0104972', naam: 'Woordvoerder VR Zaanstreek-Waterland', kleur: '#a78bfa' },
            { code: '0127185', naam: 'Woordvoerder VR Kennemerland', kleur: '#2dd4bf' },
            { code: '0205625', naam: 'Woordvoerder VR Noord-Holland-Noord', kleur: '#f472b6' },
        ];
        // Beide feeds worden opgehaald en samengevoegd; valt er één uit, dan komt de andere nog door.
        // Alles uit beide feeds wordt getoond; dubbele meldingen worden samengevoegd.
        const FEEDS = [
            { naam: 'alarmeringen.nl', url: 'https://alarmeringen.nl/feeds/user/e3826aac-12d9-4685-be9e-e30a469de97c.rss' },
            { naam: 'alarmeringdroid', url: 'https://www.alarmeringdroid.nl/rss/7738690e' },
        ];
        const VERVERS_MS = 60 * 1000;          // nieuwe meldingen ophalen
        const OPNIEUW_MS = 20 * 1000;          // na een mislukte poging sneller opnieuw proberen
        const HERLAAD_MS = 60 * 1000;          // hele pagina opnieuw laden (Chromecast/tv: blijft zo actueel)
        const NIEUW_MS = 15 * 60 * 1000;       // melding telt als "nieuw" (knipperend label)
        const CACHE_KEY = 'p2000-persalarm-v2';

        /* Een browser mag een feed van een andere site alleen lezen als die site dat toestaat (CORS).
         * Daarom proberen we een reeks routes; de route die werkt wordt onthouden en voortaan eerst gebruikt.
         * 1. Eigen server (server.py) — alleen als deze pagina via die server geopend is. Meest betrouwbaar.
         * 2. Rechtstreeks — werkt als de feed-site CORS toestaat.
         * 3. Publieke proxies en RSS-naar-JSON diensten.
         */
        const enc = encodeURIComponent;
        const routes = [
            { naam: 'eigen server', url: (u, i) => 'feed?bron=' + i, alleenViaServer: true },
            { naam: 'rechtstreeks', url: u => u },
            { naam: 'allorigins', url: u => 'https://api.allorigins.win/raw?url=' + enc(u) },
            { naam: 'allorigins-json', url: u => 'https://api.allorigins.win/get?url=' + enc(u), lees: d => d.contents },
            { naam: 'codetabs', url: u => 'https://api.codetabs.com/v1/proxy?quest=' + enc(u) },
            { naam: 'cors.lol', url: u => 'https://api.cors.lol/?url=' + enc(u) },
            { naam: 'whateverorigin', url: u => 'https://whateverorigin.org/get?url=' + enc(u), lees: d => d.contents },
            { naam: 'rss2json', url: u => 'https://api.rss2json.com/v1/api.json?rss_url=' + enc(u), rss2json: true },
        ].filter(r => !r.alleenViaServer || /^https?:$/.test(location.protocol));

        const $ = id => document.getElementById(id);

        let meldingen = [];
        let laatsteSucces = null;

        /* ================= Klok ================= */
        function tik() {
            const nu = new Date();
            $('tijd').textContent = nu.toLocaleTimeString('nl-NL');
            const d = nu.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            $('datum').textContent = d.charAt(0).toUpperCase() + d.slice(1);
        }
        tik();
        setInterval(tik, 1000);

        /* ================= Ophalen ================= */
        // Per feed onthouden welke route werkte
        FEEDS.forEach(f => {
            f.routeKey = 'p2000-route-' + f.url;
            try { f.voorkeur = localStorage.getItem(f.routeKey); } catch (e) { f.voorkeur = null; }
        });

        async function probeer(route, feed, i) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 8000);
            try {
                let url = route.url(feed.url, i);
                // Cache-buster alleen op proxy-adressen, niet op de feed zelf
                if (url !== feed.url) url += (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);

                if (route.rss2json) {
                    const d = await res.json();
                    if (d.status !== 'ok' || !Array.isArray(d.items)) throw new Error(d.message || 'geen feed');
                    return d.items.map(i => ({
                        titel: i.title, beschrijving: i.description || i.content,
                        categorie: (i.categories || []).join(' '),
                        // rss2json geeft "2026-09-27 04:41:00" in UTC
                        ruweDatum: /^\d{4}-\d\d-\d\d \d/.test(i.pubDate || '') ? i.pubDate.replace(' ', 'T') + 'Z' : i.pubDate,
                        id: i.guid || i.link,
                    }));
                }
                const tekst = route.lees ? route.lees(await res.json()) : await res.text();
                if (!tekst || !/<(rss|feed|rdf:RDF|channel)[\s>]/i.test(tekst)) throw new Error('antwoord is geen feed');
                return leesXml(tekst);
            } catch (e) {
                throw new Error(e.name === 'AbortError' ? 'time-out' : (e.message === 'Failed to fetch' ? 'geblokkeerd' : e.message));
            } finally {
                clearTimeout(timer);
            }
        }

        async function haalFeed(feed, i) {
            const volgorde = [...routes].sort((a, b) => (b.naam === feed.voorkeur) - (a.naam === feed.voorkeur));
            const fouten = [];
            for (const route of volgorde) {
                try {
                    const items = await probeer(route, feed, i);
                    if (route.naam !== feed.voorkeur) {
                        feed.voorkeur = route.naam;
                        try { localStorage.setItem(feed.routeKey, route.naam); } catch (e) { /* geen opslag */ }
                    }
                    return { items, route: route.naam };
                } catch (e) {
                    console.warn(feed.naam, 'route mislukt:', route.naam, e.message);
                    fouten.push(route.naam + ': ' + e.message);
                }
            }
            throw new Error(fouten.join(' · '));
        }

        function stripHtml(html) {
            const doc = new DOMParser().parseFromString(html || '', 'text/html');
            return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
        }

        // Datum uit de feed halen: RFC-822/ISO (pubDate, dc:date, Atom) of Nederlandse notatie in de tekst
        function leesDatum(...kandidaten) {
            for (const k of kandidaten) {
                if (!k) continue;
                const d = new Date(k);
                if (!isNaN(d)) return d.getTime();
                const nl = k.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
                if (nl) {
                    const jaar = nl[3].length === 2 ? 2000 + +nl[3] : +nl[3];
                    return new Date(jaar, nl[2] - 1, nl[1], nl[4], nl[5], nl[6] || 0).getTime();
                }
            }
            return null;
        }

        // XML (RSS of Atom) omzetten naar ruwe items
        function leesXml(xml) {
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            if (doc.querySelector('parsererror')) throw new Error('feed kon niet worden gelezen');

            // RSS gebruikt <item>, Atom gebruikt <entry>
            const items = [...doc.getElementsByTagName('item'), ...doc.getElementsByTagName('entry')];
            return items.map(item => {
                const get = naam => {
                    for (const n of naam.split('|')) {
                        const e = item.getElementsByTagName(n)[0];
                        if (e && e.textContent.trim()) return e.textContent.trim();
                    }
                    return '';
                };
                const link = get('link') || item.getElementsByTagName('link')[0]?.getAttribute('href') || '';
                return {
                    titel: get('title'),
                    beschrijving: get('description|summary|content|content:encoded'),
                    ruweDatum: get('pubDate|dc:date|published|updated|date'),
                    categorie: [...item.getElementsByTagName('category')].map(c => c.textContent || c.getAttribute('term') || '').join(' '),
                    id: get('guid|id') || link,
                };
            });
        }

        // Ruwe items omzetten naar meldingen voor het scherm
        function verwerk(ruw) {
            const alle = ruw.map(r => {
                const beschrijving = stripHtml(r.beschrijving);
                const titel = stripHtml(r.titel) || beschrijving;
                const tijd = leesDatum(r.ruweDatum, titel, beschrijving);
                return {
                    id: r.id || titel + (r.ruweDatum || ''),
                    titel,
                    // Tekst voor op het scherm: zonder de 7-cijferige capcodes
                    tekst: titel.replace(/\b\d{7}\b/g, '').replace(/\s+/g, ' ').trim() || titel,
                    beschrijving,
                    categorie: stripHtml(r.categorie),
                    tijd: tijd ?? Date.now(),
                    geenDatum: tijd == null,
                    capcodes: welkeCapcodes(titel + ' ' + beschrijving + ' ' + r.categorie),
                };
            });

            return alle;
        }

        /* Dezelfde melding kan in beide feeds staan (met een ander id).
         * Zelfde tekst (zonder capcodes, spaties en leestekens) binnen 5 minuten = dezelfde melding.
         */
        const sleutel = m => (m.tekst || m.titel).toLowerCase().replace(/\b\d{7}\b/g, '').replace(/[^a-z0-9]/g, '');
        function ontdubbel(lijst) {
            const uniek = [];
            for (const m of [...lijst].sort((a, b) => b.tijd - a.tijd)) {
                const k = sleutel(m);
                const dubbel = uniek.find(u => Math.abs(u.tijd - m.tijd) < 5 * 60 * 1000 &&
                    (u.sleutel === k || (Math.min(k.length, u.sleutel.length) >= 15 && (u.sleutel.startsWith(k) || k.startsWith(u.sleutel)))));
                if (dubbel) {
                    // Capcodes van beide samenvoegen
                    dubbel.capcodes = [...new Set([...(dubbel.capcodes || []), ...(m.capcodes || [])])];
                } else {
                    uniek.push({ ...m, sleutel: k });
                }
            }
            return uniek;
        }

        // Welke van onze capcodes staan in de tekst (ook zonder voorloopnul)?
        function welkeCapcodes(tekst) {
            return CAPCODES
                .filter(c => new RegExp('\\b0*' + c.code.replace(/^0+/, '') + '\\b').test(tekst))
                .map(c => c.code);
        }
        const capInfo = code => CAPCODES.find(c => c.code === code);

        /* ================= Interpretatie ================= */
        function prio(tekst) {
            const t = ' ' + tekst.toUpperCase() + ' ';
            if (/\b(P ?1|PRIO ?1)\b/.test(t)) return { k: 'p1', l: 'PRIO 1' };
            if (/\b(P ?2|PRIO ?2)\b/.test(t)) return { k: 'p2', l: 'PRIO 2' };
            if (/\b(P ?3|PRIO ?3)\b/.test(t)) return { k: 'p3', l: 'PRIO 3' };
            return null;
        }

        function geleden(ms) {
            const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
            if (s < 60) return 'zojuist';
            const m = Math.floor(s / 60);
            if (m < 60) return m + ' min geleden';
            const u = Math.floor(m / 60);
            if (u < 24) return u + ' uur ' + (m % 60) + ' min geleden';
            const d = Math.floor(u / 24);
            return d === 1 ? 'gisteren' : d + ' dagen geleden';
        }

        const fmtTijd = ms => new Date(ms).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        function fmtDag(ms) {
            const d = new Date(ms), nu = new Date();
            const gister = new Date(nu); gister.setDate(nu.getDate() - 1);
            if (d.toDateString() === nu.toDateString()) return 'Vandaag';
            if (d.toDateString() === gister.toDateString()) return 'Gisteren';
            return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
        }

        /* ================= Weergave ================= */
        function el(tag, cls, tekst) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (tekst != null) e.textContent = tekst;
            return e;
        }

        // Capcode-namen als gekleurde tekst
        function capLabels(m, parent) {
            for (const code of m.capcodes || []) {
                const c = capInfo(code);
                if (!c) continue;
                const e = el('span', 'cap', c.naam);
                e.style.setProperty('--cap', c.kleur);
                parent.appendChild(e);
            }
        }
        const isNieuw = m => Date.now() - m.tijd < NIEUW_MS;

        // Randkleur van de (eerste) capcode van de melding
        function kleur(e, m) {
            const c = capInfo((m.capcodes || [])[0]);
            if (c) e.style.setProperty('--cap', c.kleur);
        }

        function renderHero() {
            const hero = $('hero');
            hero.replaceChildren();
            hero.className = 'hero';
            hero.style.removeProperty('--cap');

            if (!meldingen.length) {
                hero.appendChild(el('div', 'empty', 'Geen recente meldingen'));
                return;
            }

            const m = meldingen[0];
            kleur(hero, m);
            if (isNieuw(m)) hero.classList.add('fresh');

            const when = el('div', 'when');
            when.appendChild(el('div', 't', fmtTijd(m.tijd)));
            when.appendChild(el('div', 'ago', geleden(m.tijd)));
            when.appendChild(el('div', 'dag', fmtDag(m.tijd)));
            hero.appendChild(when);

            const inhoud = el('div', 'inhoud');
            const tags = el('div', 'tags');
            const p = prio(m.titel);
            if (p) tags.appendChild(el('span', 'badge ' + p.k, p.l));
            if (isNieuw(m)) tags.appendChild(el('span', 'badge nieuw', 'NIEUW'));
            capLabels(m, tags);
            if (tags.childElementCount) inhoud.appendChild(tags);
            inhoud.appendChild(el('div', 'msg', m.tekst || m.titel));
            hero.appendChild(inhoud);
        }

        // Vaste lijst zonder scrollen: rijen die niet meer helemaal passen vallen onderaan weg
        function passend(lijst) {
            const onder = lijst.getBoundingClientRect().bottom;
            for (const e of [...lijst.children].reverse()) {
                if (e.getBoundingClientRect().bottom <= onder + 1) break;
                e.remove();
            }
            // Geen dagkopje onderaan laten staan zonder meldingen eronder
            while (lijst.lastElementChild?.classList.contains('dagkop')) lijst.lastElementChild.remove();
        }

        function renderLijst() {
            const lijst = $('lijst');
            lijst.replaceChildren();
            const rest = meldingen.slice(1, 40);

            if (!rest.length) {
                lijst.appendChild(el('div', 'empty', 'Geen eerdere meldingen'));
                return;
            }

            let vorigeDag = null, n = 0;
            for (const m of rest) {
                const dag = fmtDag(m.tijd);
                if (dag !== vorigeDag) {
                    lijst.appendChild(el('div', 'dagkop', dag));
                    vorigeDag = dag;
                }

                const rij = el('div', 'rij' + (n++ % 2 ? ' alt' : ''));
                kleur(rij, m);
                rij.appendChild(el('div', 't', fmtTijd(m.tijd)));

                const pk = el('div', 'prio');
                const p = prio(m.titel);
                if (p) pk.appendChild(el('span', 'badge ' + p.k, p.l));
                rij.appendChild(pk);

                const body = el('div', 'body');
                body.appendChild(el('div', 'txt', m.tekst || m.titel));
                const caps = el('div', 'caps');
                capLabels(m, caps);
                if (caps.childElementCount) body.appendChild(caps);
                rij.appendChild(body);

                lijst.appendChild(rij);
            }
            passend(lijst);
        }

        function renderStatus(fout, route, detail) {
            const dot = $('dot');
            const wanneer = ms => (fmtDag(ms) === 'Vandaag' ? '' : fmtDag(ms).toLowerCase() + ' ') + fmtTijd(ms);
            $('statusDetail').textContent = '';
            if (!fout) {
                dot.className = 'dot ok';
                $('statusTekst').textContent = 'Live · bijgewerkt ' + fmtTijd(laatsteSucces) + (route ? ' · via ' + route : '');
                if (detail) $('statusTekst').textContent += ' · ' + detail;   // één van de feeds faalt
                return;
            }
            dot.className = laatsteSucces ? 'dot warn' : 'dot err';
            $('statusTekst').textContent = laatsteSucces
                ? 'Geen verbinding · laatst bijgewerkt ' + wanneer(laatsteSucces) + ' · nieuwe poging over ' + OPNIEUW_MS / 1000 + ' s'
                : 'Geen verbinding met de feed';
            // Per route wat er misging, zodat de oorzaak op het scherm te lezen is
            if (detail) $('statusDetail').textContent = detail;
        }

        function renderAlles() {
            renderHero();
            renderLijst();
        }

        /* ================= Cache (zodat de tv na een herstart direct iets toont) ================= */
        function laadCache() {
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                if (c && Array.isArray(c.meldingen)) {
                    meldingen = c.meldingen;
                    laatsteSucces = c.tijd;
                }
            } catch (e) { /* geen opslag beschikbaar */ }
        }
        function bewaarCache() {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ tijd: laatsteSucces, meldingen: meldingen.slice(0, 100) }));
            } catch (e) { /* geen opslag beschikbaar */ }
        }

        /* ================= Hoofdlus ================= */
        let bezig = false;
        let volgendeTimer;
        async function ververs() {
            if (bezig) return;           // vorige poging loopt nog
            bezig = true;
            let ok = true;
            try {
                const resultaten = await Promise.allSettled(FEEDS.map(haalFeed));
                const gelukt = [], mislukt = [];
                resultaten.forEach((res, i) => res.status === 'fulfilled'
                    ? gelukt.push({ feed: FEEDS[i], ...res.value })
                    : mislukt.push(FEEDS[i].naam + ' — ' + res.reason.message));
                if (!gelukt.length) throw new Error(mislukt.join('\n'));
                const nieuw = gelukt.flatMap(g => verwerk(g.items));
                // Samenvoegen met wat we al hadden, zodat de historie niet verdwijnt als de feed kort is
                const bekend = new Map(meldingen.map(m => [m.id, m]));
                nieuw.forEach(m => {
                    // Zonder datum in de feed: tijdstip van eerste keer zien bewaren
                    const oud = bekend.get(m.id);
                    bekend.set(m.id, m.geenDatum && oud ? { ...m, tijd: oud.tijd } : m);
                });
                meldingen = ontdubbel([...bekend.values()]
                    .filter(m => Date.now() - m.tijd < 30 * 864e5));
                laatsteSucces = Date.now();
                bewaarCache();
                renderAlles();
                renderStatus(false, gelukt.map(g => g.feed.naam + ' (' + g.route + ')').join(' + '),
                    mislukt.length ? FEEDS.filter(f => !gelukt.some(g => g.feed === f)).map(f => f.naam).join(', ') + ' niet bereikbaar' : '');
            } catch (e) {
                console.error(e);
                if (!meldingen.length) {
                    const hero = $('hero');
                    hero.className = 'hero';
                    hero.replaceChildren(el('div', 'empty', '⚠️ Kan meldingen niet laden'));
                    hero.firstChild.appendChild(el('small', null,
                        e.message + '\n\nNieuwe poging over ' + OPNIEUW_MS / 1000 + ' s'));
                }
                renderStatus(true, null, e.message.replace(/\n/g, ' | '));
                ok = false;
            } finally {
                bezig = false;
            }
            // Volgende poging: normaal elke minuut, na een fout sneller
            clearTimeout(volgendeTimer);
            volgendeTimer = setTimeout(ververs, ok ? VERVERS_MS : OPNIEUW_MS);
        }

        // Na draaien/verkleinen van het scherm opnieuw bepalen hoeveel meldingen passen
        let resizeTimer;
        addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderLijst, 300); });

        // "x min geleden" en NIEUW-labels actueel houden tussen verversingen door
        setInterval(() => { if (meldingen.length) renderHero(); }, 30 * 1000);

        /* Pagina elke minuut volledig herladen, zodat de tv altijd de nieuwste versie draait.
         * Alleen als de pagina zelf bereikbaar is (anders zou de Chromecast op een foutpagina blijven
         * hangen) en niet midden in het ophalen van de feeds. Meldingen blijven via de cache staan.
         */
        async function herlaad() {
            if (bezig) return setTimeout(herlaad, 5000);
            if (location.protocol !== 'file:') {
                try {
                    const res = await fetch(location.href.split('#')[0], { cache: 'reload' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                } catch (e) {
                    console.warn('Pagina niet bereikbaar, herladen uitgesteld:', e.message);
                    return setTimeout(herlaad, 15000);
                }
            }
            location.reload();
        }
        setTimeout(herlaad, HERLAAD_MS);

        laadCache();
        if (meldingen.length) {
            renderAlles();
            // Net herladen: status van de vorige keer tonen i.p.v. kort 'geen verbinding'
            if (laatsteSucces && Date.now() - laatsteSucces < 3 * 60 * 1000) renderStatus(false);
            else renderStatus(true);
        }
        ververs();
    </script>
</body>
</html>
