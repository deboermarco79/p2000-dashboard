<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persalarm</title>
    <style>
        :root {
            --bg: #07090d;
            --panel: #11151c;
            --panel-2: #171c25;
            --line: #252c38;
            --text: #f2f4f8;
            --muted: #8b95a7;
            --accent: #4a90e2;
            --prio1: #e5484d;
            --prio2: #f5a524;
            --prio3: #30a46c;
            --politie: #3e8ff0;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Alles schaalt mee met de schermbreedte: werkt op 720p, 1080p en 4K */
            font-size: clamp(14px, 1.15vw, 48px);
            overflow: hidden;
            cursor: none;
        }

        /* ---------- Header ---------- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2em;
            height: 11vh;
            padding: 0 2.2vw;
            background: var(--panel);
            border-bottom: 0.2em solid var(--line);
        }
        .status {
            display: flex; align-items: center; gap: 0.6em;
            color: var(--muted); font-size: 1em; white-space: nowrap;
        }
        .dot { width: 0.8em; height: 0.8em; border-radius: 50%; background: var(--muted); }
        .dot.ok { background: var(--prio3); box-shadow: 0 0 0.6em var(--prio3); }
        .dot.warn { background: var(--prio2); }
        .dot.err { background: var(--prio1); }

        .clock { text-align: right; }
        .clock .time { font-size: 2.6em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
        .clock .date { color: var(--muted); font-size: 1.05em; margin-top: 0.25em; }

        /* ---------- Layout ---------- */
        main {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 1.6vw;
            height: 89vh;
            padding: 1.6vw 2.2vw;
        }
        .col { display: flex; flex-direction: column; gap: 1.6vw; min-height: 0; }
        .label {
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 0.7em;
        }

        /* ---------- Laatste melding (groot) ---------- */
        .hero {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex; flex-direction: column;
            background: var(--panel);
            border: 0.12em solid var(--line);
            border-left: 0.7em solid var(--cap, var(--politie));
            border-radius: 0.8em;
            padding: 1.6em 1.8em;
            overflow: hidden;
        }
        .hero.fresh { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(62, 143, 240, 0); }
            50% { box-shadow: 0 0 2.5em 0.2em rgba(62, 143, 240, 0.55); }
        }
        .hero .top { display: flex; align-items: center; gap: 0.6em 0.8em; flex-wrap: wrap; }
        .hero .ago { margin-left: auto; color: var(--muted); font-size: 1.3em; font-variant-numeric: tabular-nums; }
        .hero .msg {
            font-size: 2.6em;
            font-weight: 650;
            line-height: 1.25;
            margin: 0.6em 0 0.4em;
            overflow-wrap: anywhere;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hero .meta { margin-top: auto; display: flex; gap: 2.5em; color: var(--muted); font-size: 1.2em; flex-wrap: wrap; }
        .hero .meta b { display: block; color: var(--text); font-size: 1.35em; font-weight: 600; margin-top: 0.15em; }

        .badge {
            display: inline-flex; align-items: center;
            padding: 0.3em 0.75em;
            border-radius: 0.4em;
            font-weight: 700;
            font-size: 1.05em;
            letter-spacing: 0.03em;
            background: var(--panel-2);
            color: var(--text);
            white-space: nowrap;
        }
        .hero .badge { font-size: 1.35em; }
        .badge.p1 { background: var(--prio1); }
        .badge.p2 { background: var(--prio2); color: #1a1200; }
        .badge.p3 { background: var(--prio3); }
        .badge.cap { background: transparent; color: var(--cap); box-shadow: inset 0 0 0 0.12em var(--cap); }
        .badge.nieuw { background: #fff; color: #000; animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }


        /* ---------- Statistieken ---------- */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6vw; }
        .stat {
            background: var(--panel);
            border: 0.12em solid var(--line);
            border-radius: 0.8em;
            padding: 1em 1.3em;
        }
        .stat .n { font-size: 3em; font-weight: 750; line-height: 1; font-variant-numeric: tabular-nums; }
        .stat .t { color: var(--muted); margin-top: 0.4em; font-size: 1em; }

        /* ---------- Lijst ---------- */
        .list-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        #lijst {
            flex: 1; min-height: 0;
            overflow: hidden;
            display: flex; flex-direction: column; gap: 0.7em;
            scroll-behavior: smooth;
        }
        .item {
            display: grid;
            grid-template-columns: 5.2em 1fr;
            gap: 0 1.1em;
            background: var(--panel);
            border: 0.12em solid var(--line);
            border-left: 0.5em solid var(--cap, var(--politie));
            border-radius: 0.6em;
            padding: 0.85em 1.1em;
            flex-shrink: 0;
        }
        .item .when { font-variant-numeric: tabular-nums; }
        .item .when .h { font-size: 1.6em; font-weight: 700; line-height: 1.1; }
        .item .when .d { color: var(--muted); font-size: 0.95em; }
        .item .body { min-width: 0; }
        .item .row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4em 0.6em; margin-bottom: 0.3em; }
        .item .row .badge { font-size: 0.85em; padding: 0.2em 0.55em; }
        .item .txt {
            font-size: 1.3em; line-height: 1.3;
            overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }

        .empty {
            color: var(--muted);
            font-size: 1.6em;
            text-align: center;
            margin: auto;
            padding: 2em;
        }
        .empty small { display: block; font-size: 0.6em; margin-top: 0.8em; white-space: pre-line; line-height: 1.5; }

        /* Kleinere/staande schermen: onder elkaar */
        @media (max-aspect-ratio: 1/1) {
            body { font-size: clamp(14px, 2.2vw, 48px); overflow: auto; }
            header { height: auto; padding: 1em 16px; flex-wrap: wrap; }
            main { grid-template-columns: 1fr; height: auto; padding: 16px; }
            .hero { min-height: 40vh; }
            #lijst { overflow: visible; }
        }
    </style>
</head>
<body>
    <header>
        <div class="status">
            <span class="dot" id="dot"></span>
            <span id="statusTekst">Verbinden…</span>
        </div>
        <div class="clock">
            <div class="time" id="tijd">00:00:00</div>
            <div class="date" id="datum"></div>
        </div>
    </header>

    <main>
        <section class="col">
            <div class="label">Laatste melding</div>
            <article class="hero" id="hero">
                <div class="empty">Meldingen ophalen…</div>
            </article>
            <div class="stats">
                <div class="stat"><div class="n" id="statVandaag">–</div><div class="t">Vandaag</div></div>
                <div class="stat"><div class="n" id="stat24">–</div><div class="t">Afgelopen 24 uur</div></div>
                <div class="stat"><div class="n" id="stat7">–</div><div class="t">Afgelopen 7 dagen</div></div>
            </div>
        </section>

        <section class="col">
            <div class="list-wrap">
                <div class="label">Eerdere meldingen</div>
                <div id="lijst"></div>
            </div>
        </section>
    </main>

    <script>
        /* ================= Instellingen =================
         * Persalarmen uit de persoonlijke feed van alarmeringen.nl, voor deze capcodes:
         */
        const CAPCODES = [
            { code: '0127850', naam: 'Politie Noord-Holland · Persalarm', kleur: '#3e8ff0' },
            { code: '0104972', naam: 'Woordvoerder VR Zaanstreek-Waterland', kleur: '#a78bfa' },
            { code: '0127185', naam: 'Woordvoerder VR Kennemerland', kleur: '#2dd4bf' },
            { code: '0205625', naam: 'Woordvoerder VR Noord-Holland-Noord', kleur: '#f472b6' },
        ];
        const FEED_URL = 'https://alarmeringen.nl/feeds/user/e3826aac-12d9-4685-be9e-e30a469de97c.rss';
        const VERVERS_MS = 60 * 1000;          // nieuwe meldingen ophalen
        const NIEUW_MS = 15 * 60 * 1000;       // melding telt als "nieuw" (knipperend label)
        const SCROLL_MS = 10 * 1000;           // lijst doorbladeren
        const CACHE_KEY = 'p2000-persalarm-' + FEED_URL;

        /* Een browser mag een feed van een andere site alleen lezen als die site dat toestaat (CORS).
         * Daarom proberen we een reeks routes; de route die werkt wordt onthouden en voortaan eerst gebruikt.
         * 1. Eigen server (server.py) — alleen als deze pagina via die server geopend is. Meest betrouwbaar.
         * 2. Rechtstreeks — werkt als de feed-site CORS toestaat.
         * 3. Publieke proxies en RSS-naar-JSON diensten.
         */
        const enc = encodeURIComponent;
        const routes = [
            { naam: 'eigen server', url: () => 'feed', alleenViaServer: true },
            { naam: 'rechtstreeks', url: u => u },
            { naam: 'allorigins', url: u => 'https://api.allorigins.win/raw?url=' + enc(u) },
            { naam: 'allorigins-json', url: u => 'https://api.allorigins.win/get?url=' + enc(u), lees: d => d.contents },
            { naam: 'corsproxy.io', url: u => 'https://corsproxy.io/?url=' + enc(u) },
            { naam: 'codetabs', url: u => 'https://api.codetabs.com/v1/proxy?quest=' + enc(u) },
            { naam: 'cors.lol', url: u => 'https://api.cors.lol/?url=' + enc(u) },
            { naam: 'whateverorigin', url: u => 'https://whateverorigin.org/get?url=' + enc(u), lees: d => d.contents },
            { naam: 'rss2json', url: u => 'https://api.rss2json.com/v1/api.json?rss_url=' + enc(u), rss2json: true },
        ].filter(r => !r.alleenViaServer || /^https?:$/.test(location.protocol));

        const $ = id => document.getElementById(id);

        let meldingen = [];
        let laatsteSucces = null;

        /* ================= Klok ================= */
        function tik() {
            const nu = new Date();
            $('tijd').textContent = nu.toLocaleTimeString('nl-NL');
            const d = nu.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            $('datum').textContent = d.charAt(0).toUpperCase() + d.slice(1);
        }
        tik();
        setInterval(tik, 1000);

        /* ================= Ophalen ================= */
        const ROUTE_KEY = 'p2000-route-' + FEED_URL;
        let voorkeur = (() => { try { return localStorage.getItem(ROUTE_KEY); } catch (e) { return null; } })();

        async function probeer(route) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 8000);
            try {
                let url = route.url(FEED_URL);
                // Cache-buster alleen op proxy-adressen, niet op de feed zelf
                if (url !== FEED_URL) url += (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);

                if (route.rss2json) {
                    const d = await res.json();
                    if (d.status !== 'ok' || !Array.isArray(d.items)) throw new Error(d.message || 'geen feed');
                    return d.items.map(i => ({
                        titel: i.title, beschrijving: i.description || i.content,
                        categorie: (i.categories || []).join(' '),
                        // rss2json geeft "2026-09-27 04:41:00" in UTC
                        ruweDatum: /^\d{4}-\d\d-\d\d \d/.test(i.pubDate || '') ? i.pubDate.replace(' ', 'T') + 'Z' : i.pubDate,
                        id: i.guid || i.link,
                    }));
                }
                const tekst = route.lees ? route.lees(await res.json()) : await res.text();
                if (!tekst || !/<(rss|feed|rdf:RDF|channel)[\s>]/i.test(tekst)) throw new Error('antwoord is geen feed');
                return leesXml(tekst);
            } catch (e) {
                throw new Error(e.name === 'AbortError' ? 'time-out' : (e.message === 'Failed to fetch' ? 'geblokkeerd' : e.message));
            } finally {
                clearTimeout(timer);
            }
        }

        async function haalFeed() {
            const volgorde = [...routes].sort((a, b) => (b.naam === voorkeur) - (a.naam === voorkeur));
            const fouten = [];
            for (const route of volgorde) {
                try {
                    const items = await probeer(route);
                    if (route.naam !== voorkeur) {
                        voorkeur = route.naam;
                        try { localStorage.setItem(ROUTE_KEY, voorkeur); } catch (e) { /* geen opslag */ }
                    }
                    return { items, route: route.naam };
                } catch (e) {
                    console.warn('Route mislukt:', route.naam, e.message);
                    fouten.push(route.naam + ': ' + e.message);
                }
            }
            throw new Error('Feed niet bereikbaar. ' + fouten.join(' · '));
        }

        function stripHtml(html) {
            const doc = new DOMParser().parseFromString(html || '', 'text/html');
            return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
        }

        // Datum uit de feed halen: RFC-822/ISO (pubDate, dc:date, Atom) of Nederlandse notatie in de tekst
        function leesDatum(...kandidaten) {
            for (const k of kandidaten) {
                if (!k) continue;
                const d = new Date(k);
                if (!isNaN(d)) return d.getTime();
                const nl = k.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
                if (nl) {
                    const jaar = nl[3].length === 2 ? 2000 + +nl[3] : +nl[3];
                    return new Date(jaar, nl[2] - 1, nl[1], nl[4], nl[5], nl[6] || 0).getTime();
                }
            }
            return null;
        }

        // XML (RSS of Atom) omzetten naar ruwe items
        function leesXml(xml) {
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            if (doc.querySelector('parsererror')) throw new Error('feed kon niet worden gelezen');

            // RSS gebruikt <item>, Atom gebruikt <entry>
            const items = [...doc.getElementsByTagName('item'), ...doc.getElementsByTagName('entry')];
            return items.map(item => {
                const get = naam => {
                    for (const n of naam.split('|')) {
                        const e = item.getElementsByTagName(n)[0];
                        if (e && e.textContent.trim()) return e.textContent.trim();
                    }
                    return '';
                };
                const link = get('link') || item.getElementsByTagName('link')[0]?.getAttribute('href') || '';
                return {
                    titel: get('title'),
                    beschrijving: get('description|summary|content|content:encoded'),
                    ruweDatum: get('pubDate|dc:date|published|updated|date'),
                    categorie: [...item.getElementsByTagName('category')].map(c => c.textContent || c.getAttribute('term') || '').join(' '),
                    id: get('guid|id') || link,
                };
            });
        }

        // Ruwe items omzetten naar meldingen voor het scherm
        function verwerk(ruw) {
            const alle = ruw.map(r => {
                const beschrijving = stripHtml(r.beschrijving);
                const titel = stripHtml(r.titel) || beschrijving;
                const tijd = leesDatum(r.ruweDatum, titel, beschrijving);
                return {
                    id: r.id || titel + (r.ruweDatum || ''),
                    titel,
                    // Tekst voor op het scherm: zonder de 7-cijferige capcodes
                    tekst: titel.replace(/\b\d{7}\b/g, '').replace(/\s+/g, ' ').trim() || titel,
                    beschrijving,
                    categorie: stripHtml(r.categorie),
                    tijd: tijd ?? Date.now(),
                    geenDatum: tijd == null,
                    capcodes: welkeCapcodes(titel + ' ' + beschrijving + ' ' + r.categorie),
                };
            });

            // Alleen meldingen voor onze capcodes. Staat er geen enkele capcode in een item,
            // dan is de persoonlijke feed al gefilterd en tonen we het gewoon.
            const gefilterd = alle.filter(m => m.capcodes.length || !/\b\d{7}\b/.test(m.titel + ' ' + m.beschrijving));
            // Filter houdt niets over? Dan noteert de feed capcodes anders: liever alles dan een leeg scherm.
            return (gefilterd.length ? gefilterd : alle).sort((a, b) => b.tijd - a.tijd);
        }

        // Welke van onze capcodes staan in de tekst (ook zonder voorloopnul)?
        function welkeCapcodes(tekst) {
            return CAPCODES
                .filter(c => new RegExp('\\b0*' + c.code.replace(/^0+/, '') + '\\b').test(tekst))
                .map(c => c.code);
        }
        const capInfo = code => CAPCODES.find(c => c.code === code);

        /* ================= Interpretatie ================= */
        function prio(tekst) {
            const t = ' ' + tekst.toUpperCase() + ' ';
            if (/\b(P ?1|PRIO ?1)\b/.test(t)) return { k: 'p1', l: 'PRIO 1' };
            if (/\b(P ?2|PRIO ?2)\b/.test(t)) return { k: 'p2', l: 'PRIO 2' };
            if (/\b(P ?3|PRIO ?3)\b/.test(t)) return { k: 'p3', l: 'PRIO 3' };
            return null;
        }

        // Laatste stuk van de tekst met een postcode/plaatsnaam, als die er in staat
        function locatie(tekst) {
            const pc = tekst.match(/\b\d{4}\s?[A-Z]{2}\b.*$/);
            return pc ? pc[0].trim() : '';
        }

        function geleden(ms) {
            const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
            if (s < 60) return 'zojuist';
            const m = Math.floor(s / 60);
            if (m < 60) return m + ' min geleden';
            const u = Math.floor(m / 60);
            if (u < 24) return u + ' uur ' + (m % 60) + ' min geleden';
            const d = Math.floor(u / 24);
            return d === 1 ? 'gisteren' : d + ' dagen geleden';
        }

        const fmtTijd = ms => new Date(ms).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        function fmtDag(ms) {
            const d = new Date(ms), nu = new Date();
            const gister = new Date(nu); gister.setDate(nu.getDate() - 1);
            if (d.toDateString() === nu.toDateString()) return 'Vandaag';
            if (d.toDateString() === gister.toDateString()) return 'Gisteren';
            return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
        }

        /* ================= Weergave ================= */
        function el(tag, cls, tekst) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (tekst != null) e.textContent = tekst;
            return e;
        }

        function badges(m, parent) {
            for (const code of m.capcodes || []) {
                const c = capInfo(code);
                if (!c) continue;
                const b = el('span', 'badge cap', c.naam);
                b.style.setProperty('--cap', c.kleur);
                parent.appendChild(b);
            }
            const p = prio(m.titel);
            if (p) parent.appendChild(el('span', 'badge ' + p.k, p.l));
            if (Date.now() - m.tijd < NIEUW_MS) parent.appendChild(el('span', 'badge nieuw', 'NIEUW'));
        }

        // Randkleur van de (eerste) capcode van de melding
        function kleur(e, m) {
            const c = capInfo((m.capcodes || [])[0]);
            if (c) e.style.setProperty('--cap', c.kleur);
        }

        function renderHero() {
            const hero = $('hero');
            hero.replaceChildren();
            hero.className = 'hero';

            if (!meldingen.length) {
                const leeg = el('div', 'empty', 'Geen recente meldingen');
                hero.appendChild(leeg);
                return;
            }

            const m = meldingen[0];
            kleur(hero, m);
            if (Date.now() - m.tijd < NIEUW_MS) hero.classList.add('fresh');

            const top = el('div', 'top');
            badges(m, top);
            hero.appendChild(top);

            hero.appendChild(el('div', 'msg', m.tekst || m.titel));

            const meta = el('div', 'meta');
            const blok = (label, waarde) => {
                const d = el('div', null, label);
                d.appendChild(el('b', null, waarde));
                meta.appendChild(d);
            };
            blok('Tijd', fmtTijd(m.tijd));
            blok('Geleden', geleden(m.tijd));
            blok('Datum', fmtDag(m.tijd));
            const loc = locatie(m.tekst || m.titel);
            if (loc) blok('Locatie', loc);
            hero.appendChild(meta);
        }

        function renderLijst() {
            const lijst = $('lijst');
            lijst.replaceChildren();
            const rest = meldingen.slice(1, 40);

            if (!rest.length) {
                lijst.appendChild(el('div', 'empty', 'Geen eerdere meldingen'));
                return;
            }

            for (const m of rest) {
                const item = el('div', 'item');
                kleur(item, m);

                const when = el('div', 'when');
                when.appendChild(el('div', 'h', fmtTijd(m.tijd)));
                when.appendChild(el('div', 'd', fmtDag(m.tijd)));
                item.appendChild(when);

                const body = el('div', 'body');
                const row = el('div', 'row');
                badges(m, row);
                if (row.childElementCount) body.appendChild(row);
                body.appendChild(el('div', 'txt', m.tekst || m.titel));
                item.appendChild(body);

                lijst.appendChild(item);
            }
        }

        function renderStats() {
            const nu = Date.now();
            const middernacht = new Date(); middernacht.setHours(0, 0, 0, 0);
            $('statVandaag').textContent = meldingen.filter(m => m.tijd >= middernacht.getTime()).length;
            $('stat24').textContent = meldingen.filter(m => nu - m.tijd < 864e5).length;
            $('stat7').textContent = meldingen.filter(m => nu - m.tijd < 7 * 864e5).length;
        }

        function renderStatus(fout, route) {
            const dot = $('dot');
            if (!fout) {
                dot.className = 'dot ok';
                $('statusTekst').textContent = 'Live · bijgewerkt ' + fmtTijd(laatsteSucces) + (route ? ' · via ' + route : '');
            } else if (laatsteSucces) {
                dot.className = 'dot warn';
                $('statusTekst').textContent = 'Geen verbinding · laatst bijgewerkt ' + fmtTijd(laatsteSucces);
            } else {
                dot.className = 'dot err';
                $('statusTekst').textContent = 'Geen verbinding met de feed';
            }
        }

        function renderAlles() {
            renderHero();
            renderLijst();
            renderStats();
        }

        /* ================= Cache (zodat de tv na een herstart direct iets toont) ================= */
        function laadCache() {
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                if (c && Array.isArray(c.meldingen)) {
                    meldingen = c.meldingen;
                    laatsteSucces = c.tijd;
                }
            } catch (e) { /* geen opslag beschikbaar */ }
        }
        function bewaarCache() {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ tijd: laatsteSucces, meldingen: meldingen.slice(0, 100) }));
            } catch (e) { /* geen opslag beschikbaar */ }
        }

        /* ================= Hoofdlus ================= */
        let bezig = false;
        async function ververs() {
            if (bezig) return;           // vorige poging loopt nog
            bezig = true;
            try {
                const { items, route } = await haalFeed();
                const nieuw = verwerk(items);
                // Samenvoegen met wat we al hadden, zodat de historie niet verdwijnt als de feed kort is
                const bekend = new Map(meldingen.map(m => [m.id, m]));
                nieuw.forEach(m => {
                    // Zonder datum in de feed: tijdstip van eerste keer zien bewaren
                    const oud = bekend.get(m.id);
                    bekend.set(m.id, m.geenDatum && oud ? { ...m, tijd: oud.tijd } : m);
                });
                meldingen = [...bekend.values()]
                    .filter(m => Date.now() - m.tijd < 30 * 864e5)
                    .sort((a, b) => b.tijd - a.tijd);
                laatsteSucces = Date.now();
                bewaarCache();
                renderAlles();
                renderStatus(false, route);
            } catch (e) {
                console.error(e);
                if (!meldingen.length) {
                    const hero = $('hero');
                    hero.className = 'hero';
                    hero.replaceChildren(el('div', 'empty', '⚠️ Kan meldingen niet laden'));
                    hero.firstChild.appendChild(el('small', null,
                        e.message.replace(/ · /g, '\n') + '\n\nNieuwe poging over ' + VERVERS_MS / 1000 + ' s'));
                }
                renderStatus(true);
            } finally {
                bezig = false;
            }
        }

        // Lijst langzaam doorbladeren als niet alles op het scherm past
        setInterval(() => {
            const lijst = $('lijst');
            const max = lijst.scrollHeight - lijst.clientHeight;
            if (max <= 0) return;
            const volgende = lijst.scrollTop + lijst.clientHeight * 0.8;
            lijst.scrollTop = volgende >= max + 5 ? 0 : Math.min(volgende, max);
        }, SCROLL_MS);

        // "x min geleden" en NIEUW-labels actueel houden tussen verversingen door
        setInterval(() => { if (meldingen.length) { renderHero(); renderStats(); } }, 30 * 1000);

        laadCache();
        if (meldingen.length) { renderAlles(); renderStatus(true); }
        ververs();
        setInterval(ververs, VERVERS_MS);
    </script>
</body>
</html>
