<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuws</title>
<style>
    :root { --bg:#0a0d12; --panel:#121720; --line:#232a36; --text:#eef1f6; --muted:#9ba6b8; --accent:#3e8ff0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 1400px; margin: 0 auto; padding: clamp(12px, 2.5vw, 32px); }
    /* Twee kolommen op brede schermen, één kolom onder 820px */
    .kolommen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 2.5vw, 36px); align-items: start; }
    @media (max-width: 820px) { .kolommen { grid-template-columns: minmax(0, 1fr); } }
    h2 { margin: 0 0 14px; font-size: clamp(1rem, 1.6vw, 1.3rem); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .kaart { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: clamp(14px, 2vw, 22px); }
    /* Foto eerst en prominent, daarna de kop */
    .foto { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #1b2230; }
    .foto.leeg { display: flex; align-items: center; justify-content: center; color: var(--dim, #5d6778); font-size: .9rem; }
    .kop { margin: 0; padding: 14px 16px 16px; font-size: clamp(1.05rem, 1.7vw, 1.4rem); line-height: 1.25; font-weight: 700; }
    .kop a { color: inherit; text-decoration: none; }
    .soort { color: var(--accent); text-transform: uppercase; font-size: .7em; letter-spacing: .05em; }
    .fout { color: var(--muted); padding: 20px 0; }
</style>
</head>
<body>
<main>
    <div class="kolommen">
        <section><h2>Nieuws Eenheid Noord-Holland</h2><div id="k0"><div class="fout">Laden…</div></div></section>
        <section><h2>Gezocht en vermist</h2><div id="k1"><div class="fout">Laden…</div></div></section>
    </div>
</main>
<script>
const AANTAL = 5;                       // per feed alleen de vijf meest recente items
const VERVERS_MS = 5 * 60 * 1000;
const el = (tag, cls, tekst) => { const e = document.createElement(tag); if (cls) e.className = cls; if (tekst != null) e.textContent = tekst; return e; };

function toon(i, items) {
    const k = document.getElementById('k' + i);
    while (k.firstChild) k.removeChild(k.firstChild);
    if (!items.length) { k.appendChild(el('div', 'fout', 'Geen berichten gevonden.')); return; }
    items.slice(0, AANTAL).forEach(it => {
        const kaart = el('article', 'kaart');
        let foto;
        if (it.plaatje) {
            foto = el('img', 'foto'); foto.src = it.plaatje; foto.alt = ''; foto.loading = 'lazy';
            foto.onerror = () => { const v = el('div', 'foto leeg', 'Geen foto beschikbaar'); foto.replaceWith(v); };
        } else foto = el('div', 'foto leeg', 'Geen foto beschikbaar');
        kaart.appendChild(foto);
        const kop = el('h3', 'kop');
        if (i) kop.appendChild(el('small', 'soort', it.bron + ' · '));
        if (it.url) { const l = el('a', null, it.titel); l.href = it.url; l.target = '_blank'; l.rel = 'noopener'; kop.appendChild(l); } else kop.appendChild(document.createTextNode(it.titel));
        kaart.appendChild(kop);
        k.appendChild(kaart);
    });
}

/* Alles loopt via de eigen server (api/data.js op Vercel, of server.py): die praat met api.politie.nl,
 * houdt de API-sleutel geheim en filtert op Eenheid Noord-Holland (url begint met "04-"). */
/* Vangnet voor kolom 1: de politie-API blokkeert soms serverfuncties op Vercel (HTTP 403 "Access Denied").
 * Dan vraagt de browser de API zelf aan (je eigen thuis-IP wordt meestal niet geblokkeerd), mits de API
 * dat met CORS toestaat. Zelfde filter als op de server: url eindigt op /04-... (Eenheid Noord-Holland). */
const EENHEID = '04';
const abs = u => !u ? '' : /^https?:/.test(u) ? u : 'https://www.politie.nl' + (u.startsWith('/') ? '' : '/') + u;
async function nieuwsRechtstreeks() {
    const uit = [];
    for (let offset = 0; offset < 200 && uit.length < AANTAL; offset += 25) {
        const r = await fetch('https://api.politie.nl/v4/nieuws?language=nl&maxnumberofitems=25&offset=' + offset, { cache: 'no-store' });
        if (r.status === 204) break;
        if (!r.ok) throw new Error('rechtstreeks HTTP ' + r.status);
        const d = await r.json();
        (d.nieuwsberichten || []).filter(b => new RegExp('/' + EENHEID + '-[^/]*$').test(String(b.url || b.path || '').split('?')[0]))
            .forEach(b => uit.push({ bron: 'Nieuws Noord-Holland', titel: b.titel, plaatje: abs(b.afbeelding && b.afbeelding.url), url: b.url }));
        if (!d.iterator || d.iterator.last) break;
    }
    return uit;
}

/* Normaal loopt alles via de eigen server (api/data.js op Vercel, of server.py): die houdt de API-sleutel geheim. */
async function laad(i) {
    const k = document.getElementById('k' + i);
    const fouten = [];
    try {
        const r = await fetch('data/nieuws' + i, { cache: 'no-store' });
        if (!r.ok) throw new Error((await r.text()).slice(0, 200) || 'HTTP ' + r.status);
        toon(i, await r.json());
        return;
    } catch (e) { fouten.push('server: ' + e.message); }
    if (i === 0) {
        try { toon(0, await nieuwsRechtstreeks()); return; }
        catch (e) { fouten.push('rechtstreeks: ' + (e.message === 'Failed to fetch' ? 'geblokkeerd (CORS)' : e.message)); }
    }
    if (!k.querySelector('.kaart')) { k.textContent = ''; k.appendChild(el('div', 'fout', 'Niet beschikbaar: ' + fouten.join(' · '))); }
}
const alles = () => { laad(0); laad(1); };
alles(); setInterval(alles, VERVERS_MS);
</script>
</body>
</html>
