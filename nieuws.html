<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuws</title>
<style>
    :root { --bg:#0a0d12; --panel:#121720; --line:#232a36; --text:#eef1f6; --muted:#9ba6b8; --accent:#3e8ff0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 1400px; margin: 0 auto; padding: clamp(12px, 2.5vw, 32px); }
    /* Twee kolommen op brede schermen, één kolom onder 820px */
    .kolommen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 2.5vw, 36px); align-items: start; }
    @media (max-width: 820px) { .kolommen { grid-template-columns: minmax(0, 1fr); } }
    h2 { margin: 0 0 14px; font-size: clamp(1rem, 1.6vw, 1.3rem); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .kaart { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: clamp(14px, 2vw, 22px); }
    /* Foto eerst en prominent, daarna de kop */
    .foto { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #1b2230; }
    .foto.leeg { display: flex; align-items: center; justify-content: center; color: var(--dim, #5d6778); font-size: .9rem; }
    .kop { margin: 0; padding: 14px 16px 16px; font-size: clamp(1.05rem, 1.7vw, 1.4rem); line-height: 1.25; font-weight: 700; }
    .kop a { color: inherit; text-decoration: none; }
    .fout { color: var(--muted); padding: 20px 0; }
</style>
</head>
<body>
<main>
    <div class="kolommen">
        <section><h2 id="t0">Nieuws 1</h2><div id="k0"><div class="fout">Laden…</div></div></section>
        <section><h2 id="t1">Nieuws 2</h2><div id="k1"><div class="fout">Laden…</div></div></section>
    </div>
</main>
<script>
const AANTAL = 5;                       // per feed alleen de vijf meest recente items
const VERVERS_MS = 5 * 60 * 1000;
const el = (tag, cls, tekst) => { const e = document.createElement(tag); if (cls) e.className = cls; if (tekst != null) e.textContent = tekst; return e; };

function toon(i, items) {
    const k = document.getElementById('k' + i);
    while (k.firstChild) k.removeChild(k.firstChild);
    if (!items.length) { k.appendChild(el('div', 'fout', 'Geen berichten gevonden.')); return; }
    items.slice(0, AANTAL).forEach(it => {
        const kaart = el('article', 'kaart');
        let foto;
        if (it.plaatje) {
            foto = el('img', 'foto'); foto.src = it.plaatje; foto.alt = ''; foto.loading = 'lazy';
            foto.onerror = () => { const v = el('div', 'foto leeg', 'Geen foto beschikbaar'); foto.replaceWith(v); };
        } else foto = el('div', 'foto leeg', 'Geen foto beschikbaar');
        kaart.appendChild(foto);
        kaart.appendChild(el('h3', 'kop', it.titel));
        k.appendChild(kaart);
    });
    document.getElementById('t' + i).textContent = items[0].bron + (i ? ' (2)' : ' (1)');
}

/* Slim ophalen, zoals het P2000-dashboard: een reeks routes, de werkende route wordt onthouden.
 * 1. eigen endpoint (server.py of Vercel), 2. eigen proxy /api/feed, 3. rechtstreeks, 4. publieke proxies. */
const BRONNEN = [
    'https://rss.politie.nl/rss/ob/provincies/noord-holland.xml',
    'https://rss.politie.nl/rss/ab/provincies/noord-holland.xml',
];
const enc = encodeURIComponent;
const ROUTES = [
    { naam: 'eigen', json: true, url: (u, i) => 'data/nieuws' + i, timeout: 15000 },
    { naam: 'eigen proxy', url: u => '/api/feed?url=' + enc(u), timeout: 15000 },
    { naam: 'rechtstreeks', url: u => u },
    { naam: 'allorigins', url: u => 'https://api.allorigins.win/raw?url=' + enc(u) },
    { naam: 'allorigins-json', url: u => 'https://api.allorigins.win/get?url=' + enc(u), lees: d => d.contents },
    { naam: 'codetabs', url: u => 'https://api.codetabs.com/v1/proxy?quest=' + enc(u) },
    { naam: 'cors.lol', url: u => 'https://api.cors.lol/?url=' + enc(u) },
];

function leesXml(tekst, bron) {
    const doc = new DOMParser().parseFromString(tekst, 'text/xml');
    if (doc.querySelector('parsererror') || !doc.querySelector('item')) throw new Error('geen feed');
    return [...doc.querySelectorAll('item')].slice(0, AANTAL).map(item => {
        const t = tag => { const x = item.getElementsByTagName(tag)[0]; return x ? x.textContent.trim() : ''; };
        let plaatje = '';
        for (const tag of ['media:content', 'media:thumbnail', 'enclosure']) {
            const x = item.getElementsByTagName(tag)[0];
            if (x && x.getAttribute('url') && (tag !== 'enclosure' || /image/.test(x.getAttribute('type') || 'image'))) { plaatje = x.getAttribute('url'); break; }
        }
        if (!plaatje) { const m = (t('description') + ' ' + t('content:encoded')).match(/<img[^>]+src=["']([^"']+)/i); if (m) plaatje = m[1]; }
        return { bron, titel: t('title'), plaatje };
    });
}

async function probeer(route, i) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), route.timeout || 8000);
    try {
        const r = await fetch(route.url(BRONNEN[i], i), { cache: 'no-store', signal: ctrl.signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        if (route.json) { const d = await r.json(); if (!Array.isArray(d)) throw new Error('geen lijst'); return d; }
        return leesXml(route.lees ? route.lees(await r.json()) : await r.text(), 'Politie Noord-Holland');
    } finally { clearTimeout(timer); }
}

async function laad(i) {
    const sleutel = 'nieuws-route-' + i;
    let voorkeur = null;
    try { voorkeur = localStorage.getItem(sleutel); } catch (e) {}
    const volgorde = [...ROUTES].sort((a, b) => (b.naam === voorkeur) - (a.naam === voorkeur));
    const fouten = [];
    for (const route of volgorde) {
        try {
            const items = await probeer(route, i);
            try { localStorage.setItem(sleutel, route.naam); } catch (e) {}
            toon(i, items);
            return;
        } catch (e) { console.warn('nieuws', i, 'route mislukt:', route.naam, e.message); fouten.push(route.naam + ': ' + (e.name === 'AbortError' ? 'time-out' : e.message === 'Failed to fetch' ? 'geblokkeerd' : e.message)); }
    }
    const k = document.getElementById('k' + i);
    if (!k.querySelector('.kaart')) { k.textContent = ''; k.appendChild(el('div', 'fout', 'Feed niet bereikbaar.'));
        k.appendChild(el('div', 'fout', fouten.join(' · '))); }
}
const alles = () => { laad(0); laad(1); };
alles(); setInterval(alles, VERVERS_MS);
</script>
</body>
</html>
