# Haalt politie-data op vanaf een GitHub-runner (api.politie.nl blokkeert Vercel) en stuurt die naar /api/push.
# Secrets (Settings > Secrets and variables > Actions):
#   VERCEL_URL           bijv. https://narrowcasting-roan.vercel.app (zonder slash aan het eind)
#   PUSH_TOKEN           dezelfde waarde als PUSH_TOKEN in Vercel
#   POLITIE_API_KEY      optioneel, alleen voor gezocht/vermist
name: Politie-data naar Vercel
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nieuws Noord-Holland
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          POLITIE_API_KEY: ${{ secrets.POLITIE_API_KEY }}
        run: |
          set -u
          kop=(-H "Accept: application/json" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")
          [ -n "$POLITIE_API_KEY" ] && kop+=(-H "x-api-key: $POLITIE_API_KEY")
          push() { # soort offset bron-url
            code=$(curl -s -o body.json -w '%{http_code}' "${kop[@]}" "$3") || true
            if [ "$code" != 200 ]; then echo "::error::$1 offset $2: politie-api gaf HTTP $code"; head -c 300 body.json; echo; return 1; fi
            out=$(curl -sS -X POST -H "Content-Type: application/json" -H "x-push-token: $PUSH_TOKEN" --data-binary @body.json "$VERCEL_URL/api/push?soort=$1&offset=$2")
            echo "$1 offset $2 -> $out"
          }
          fout=0
          for o in 0 25 50 75; do push nieuws $o "https://api.politie.nl/v4/nieuws?language=nl&maxnumberofitems=25&offset=$o" || fout=1; done
          if [ -n "$POLITIE_API_KEY" ]; then
            for s in gezocht vermist; do push $s 0 "https://api.politie.nl/v5/$s?language=nl&maxnumberofitems=25" || fout=1; done
          fi
          exit $fout
